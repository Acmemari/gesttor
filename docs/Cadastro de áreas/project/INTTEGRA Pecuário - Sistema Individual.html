<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesttor · Sistema Individual — Inttegra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ===== Gesttor / Inttegra — Sistema Individual ===== */
:root{
  --blue:#2563eb; --blue-soft:#eaf1fb; --blue-line:#cfe0fb;
  --text:#1f2430; --muted:#6b7280; --line:#e5e7eb; --bg:#f9fafb; --card:#ffffff;
  --ok:#16a34a; --alerta:#d97706; --pend:#ea580c; --crit:#dc2626;
  --green:#16a34a; --green-soft:#e7f6ec; --orange:#ea580c; --orange-soft:#fdeee3;
  --blue-badge:#2563eb; --blue-badge-soft:#eaf1fb;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 4px 12px rgba(16,24,40,.08), 0 2px 4px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px rgba(16,24,40,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--text); background:var(--bg);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--blue-soft);}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden;}
.app.collapsed{grid-template-columns:72px 1fr;}

/* ===== Sidebar ===== */
.sidebar{
  background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.sb-brand{
  display:flex;align-items:center;gap:10px;padding:18px 18px 14px;
}
.sb-logo{
  width:30px;height:30px;border-radius:8px;background:var(--blue);
  display:grid;place-items:center;color:#fff;flex-shrink:0;
  box-shadow:0 2px 6px rgba(37,99,235,.35);
}
.sb-logo svg{width:18px;height:18px;}
.sb-brand .name{font-weight:700;font-size:17px;letter-spacing:-.01em;}
.sb-collapse{
  margin-left:auto;width:28px;height:28px;border:none;background:transparent;
  border-radius:6px;color:var(--muted);display:grid;place-items:center;
}
.sb-collapse:hover{background:var(--bg);color:var(--text);}
.app.collapsed .sb-brand .name{display:none;}

.sb-nav{flex:1;overflow-y:auto;padding:6px 12px 12px;}
.sb-nav::-webkit-scrollbar{width:8px;}
.sb-nav::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:8px;}
.sb-group-label{
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:#9ca3af;padding:16px 10px 7px;
}
.app.collapsed .sb-group-label{text-align:center;font-size:9px;padding:14px 0 6px;}
.sb-item{
  display:flex;align-items:center;gap:11px;width:100%;border:none;background:transparent;
  padding:8px 10px;border-radius:8px;color:var(--text);font-size:13.5px;font-weight:500;
  text-align:left;position:relative;margin-bottom:1px;
}
.sb-item:hover{background:#f4f5f7;}
.sb-item.active{background:var(--blue-soft);color:var(--blue);font-weight:600;}
.sb-item.active svg{color:var(--blue);}
.sb-item svg{width:18px;height:18px;color:#6b7280;flex-shrink:0;}
.sb-item .chev{margin-left:auto;width:14px;height:14px;color:#9ca3af;}
.sb-item .badge-count{
  margin-left:auto;background:var(--orange);color:#fff;font-size:11px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;
}
.app.collapsed .sb-item{justify-content:center;padding:9px;}
.app.collapsed .sb-item .label,.app.collapsed .sb-item .chev,.app.collapsed .sb-item .badge-count{display:none;}

.sb-user{
  margin:8px 12px 12px;padding:10px;border:1px solid var(--line);border-radius:10px;
  display:flex;align-items:center;gap:10px;background:#fff;
}
.sb-avatar{
  width:34px;height:34px;border-radius:8px;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-weight:700;flex-shrink:0;
}
.sb-user .u-name{font-weight:600;font-size:13px;line-height:1.2;}
.sb-user .u-role{font-size:11.5px;color:var(--muted);}
.sb-user .u-ver{font-size:10.5px;color:#9ca3af;margin-top:2px;letter-spacing:.02em;}
.app.collapsed .sb-user .u-meta{display:none;}

/* ===== Topbar ===== */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.topbar{
  height:56px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:0 20px;flex-shrink:0;
}
.tb-context{display:flex;align-items:center;gap:4px;}
.tb-drop{
  display:flex;align-items:center;gap:7px;border:none;background:transparent;
  padding:6px 9px;border-radius:8px;color:var(--text);font-size:13.5px;font-weight:500;
}
.tb-drop:hover{background:var(--bg);}
.tb-drop .sub{font-size:11px;color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.tb-drop svg{width:14px;height:14px;color:#9ca3af;}
.tb-sep{color:#d1d5db;font-size:16px;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.tb-support{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;
  padding:7px 13px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text);position:relative;
}
.tb-support:hover{background:var(--bg);}
.tb-support .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--crit);border:2px solid #fff;}

/* ===== Content ===== */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 32px 64px;min-width:0;}
.content::-webkit-scrollbar{width:10px;}
.content::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:8px;}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;}
.page-head .ph-text{min-width:0;}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;}
.page-sub{color:var(--muted);font-size:13.5px;margin-top:3px;max-width:680px;}
.page-head .ph-actions{margin-left:auto;display:flex;gap:9px;flex-shrink:0;}

/* layer badge */
.layer{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:999px;white-space:nowrap;
}
.layer .dot{width:7px;height:7px;border-radius:50%;}
.layer.estoque{background:var(--blue-badge-soft);color:var(--blue-badge);}
.layer.estoque .dot{background:var(--blue-badge);}
.layer.individual{background:var(--green-soft);color:var(--green);}
.layer.individual .dot{background:var(--green);}
.layer.mesa{background:var(--orange-soft);color:var(--orange);}
.layer.mesa .dot{background:var(--orange);}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;}
.tab{
  border:none;background:transparent;padding:10px 14px;font-size:13.5px;font-weight:500;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;
  padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--text);
}
.btn:hover{background:var(--bg);}
.btn svg{width:16px;height:16px;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.3);}
.btn.primary:hover{background:#1d4ed8;}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);}
.btn.ghost:hover{background:var(--bg);color:var(--text);}
.btn.outline{border-color:var(--blue);color:var(--blue);background:#fff;}
.btn.outline:hover{background:var(--blue-soft);}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn.danger{color:var(--crit);border-color:#f3c6c6;}
.btn.danger:hover{background:#fef2f2;}

/* card grid (module launcher) */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:1100px){.card-grid{grid-template-columns:repeat(2,1fr);}}
.mod-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;
  transition:border-color .12s,box-shadow .12s,transform .12s;
}
.mod-card:hover{border-color:var(--blue-line);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.mod-card .mc-top{display:flex;align-items:flex-start;}
.mc-icon{
  width:40px;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;color:#374151;
}
.mc-icon svg{width:20px;height:20px;}
.mc-star{margin-left:auto;border:none;background:transparent;color:#d1d5db;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;}
.mc-star:hover{background:var(--bg);}
.mc-star.on{color:#f59e0b;}
.mc-star svg{width:18px;height:18px;}
.mod-card .mc-title{font-weight:700;font-size:14.5px;}
.mod-card .mc-desc{color:var(--muted);font-size:12.8px;line-height:1.5;}
.mod-card .mc-foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px;}
.mod-card .mc-badge-count{background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}

/* metric cards */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.metric .m-label{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px;}
.metric .m-value{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:7px;line-height:1;}
.metric .m-value small{font-size:14px;color:var(--muted);font-weight:600;}
.metric .m-sub{font-size:12px;color:var(--muted);margin-top:6px;}

/* panel / table */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);}
.panel-head h3{margin:0;font-size:15px;font-weight:700;}
.panel-head .ph-r{margin-left:auto;display:flex;gap:8px;align-items:center;}
.panel-note{padding:11px 18px;background:#fafbfc;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;}
.panel-note svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;color:var(--blue);}

table.tbl{width:100%;border-collapse:collapse;font-size:13.3px;}
.tbl th{
  text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:#9ca3af;padding:11px 18px;border-bottom:1px solid var(--line);background:#fcfcfd;white-space:nowrap;
}
.tbl td{padding:12px 18px;border-bottom:1px solid #f1f2f4;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tfoot td{padding:11px 18px;border-top:1px solid var(--line);background:#fcfcfd;}
.tbl tbody tr:hover{background:#fafbfc;}
.tbl td.num{font-variant-numeric:tabular-nums;font-weight:600;}
.tbl .strong{font-weight:600;}
.tbl .sub-cell{color:var(--muted);font-size:12px;}
.derived{display:inline-flex;align-items:center;gap:5px;color:var(--blue);font-weight:600;}
.derived svg{width:13px;height:13px;}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.pill .d{width:6px;height:6px;border-radius:50%;}
.pill.ok{background:var(--green-soft);color:var(--ok);}
.pill.ok .d{background:var(--ok);}
.pill.alerta{background:#fef3e2;color:var(--alerta);}
.pill.alerta .d{background:var(--alerta);}
.pill.pend{background:var(--orange-soft);color:var(--pend);}
.pill.pend .d{background:var(--pend);}
.pill.crit{background:#fdecec;color:var(--crit);}
.pill.crit .d{background:var(--crit);}
.pill.neutral{background:#f1f3f5;color:#6b7280;}
.pill.neutral .d{background:#9ca3af;}

.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:#f1f3f5;color:#4b5563;}
.tag.blue{background:var(--blue-soft);color:var(--blue);}
.tag.green{background:var(--green-soft);color:var(--green);}

.mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace;font-size:12.5px;}

/* cobertura badge */
.cob{display:inline-flex;flex-direction:column;gap:7px;}
.cob-bar{height:8px;border-radius:999px;background:#eef0f2;overflow:hidden;width:100%;}
.cob-bar > i{display:block;height:100%;border-radius:999px;}
.cob-row{display:flex;align-items:baseline;gap:8px;}
.cob-val{font-size:24px;font-weight:700;letter-spacing:-.02em;}
.cob-tag{font-size:12px;font-weight:600;}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 18px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:600;color:#374151;}
.field label .opt{color:#9ca3af;font-weight:500;}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;
  color:var(--text);background:#fff;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
.field .hint{font-size:11.5px;color:#9ca3af;}
.form-foot{display:flex;align-items:center;gap:10px;padding-top:4px;}
.form-foot .spacer{flex:1;}

.quick-launch{display:grid;grid-template-columns:1.3fr .9fr;gap:20px;align-items:start;}
@media(max-width:1000px){.quick-launch{grid-template-columns:1fr;}.form-grid{grid-template-columns:1fr;}}

.aside-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.aside-card h4{margin:0 0 4px;font-size:14px;}
.aside-card .small{font-size:12.5px;color:var(--muted);line-height:1.55;}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f2f4;font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:600;}

/* empty / list helpers */
.empty{padding:40px;text-align:center;color:var(--muted);}
.empty svg{width:34px;height:34px;color:#d1d5db;margin-bottom:8px;}

/* reconciliation cards */
.recon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;}
.recon{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.recon.crit{border-left-color:var(--crit);}
.recon-top{display:flex;align-items:flex-start;gap:10px;}
.recon-top .r-icon{width:36px;height:36px;border-radius:9px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;flex-shrink:0;}
.recon.crit .r-icon{background:#fdecec;color:var(--crit);}
.recon-top .r-icon svg{width:18px;height:18px;}
.recon h4{margin:0;font-size:14.5px;}
.recon .r-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.recon .r-body{font-size:13px;color:#374151;line-height:1.5;}
.recon .r-foot{display:flex;gap:8px;align-items:center;margin-top:2px;}

/* search input */
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:#fff;min-width:220px;}
.search svg{width:15px;height:15px;color:#9ca3af;}
.search input{border:none;outline:none;font-size:13px;font-family:inherit;width:100%;background:transparent;}

/* mini sparkbar */
.spark{display:flex;align-items:flex-end;gap:3px;height:30px;}
.spark i{width:7px;background:var(--blue-soft);border-radius:2px 2px 0 0;display:block;}
.spark i.hi{background:var(--blue);}

/* toast */
.toast-wrap{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:80;}
.toast{
  background:#fff;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:11px;
  box-shadow:var(--shadow-lg);padding:13px 15px;max-width:380px;display:flex;gap:11px;align-items:flex-start;
  animation:toastIn .28s cubic-bezier(.2,.8,.3,1);
}
.toast.warn{border-left-color:var(--pend);}
.toast.crit{border-left-color:var(--crit);}
.toast .t-icon{width:20px;height:20px;flex-shrink:0;margin-top:1px;color:var(--green);}
.toast.warn .t-icon{color:var(--pend);}
.toast.crit .t-icon{color:var(--crit);}
.toast .t-title{font-weight:700;font-size:13.5px;}
.toast .t-msg{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(16,24,40,.42);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:90;padding:24px;animation:fade .15s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:560px;max-width:100%;max-height:90vh;overflow:auto;animation:modalIn .2s cubic-bezier(.2,.8,.3,1);}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 8px;}
.modal-head h3{margin:0;font-size:17px;}
.modal-head .m-sub{font-size:13px;color:var(--muted);margin-top:3px;}
.modal-head .x{margin-left:auto;border:none;background:transparent;color:#9ca3af;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;}
.modal-head .x:hover{background:var(--bg);color:var(--text);}
.modal-body{padding:8px 22px 4px;}
.modal-foot{display:flex;gap:10px;padding:18px 22px 22px;}
.modal-foot .spacer{flex:1;}

.invariant{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#4b5563;padding:8px 0;border-bottom:1px solid #f1f2f4;}
.invariant:last-child{border-bottom:none;}
.invariant svg{width:15px;height:15px;color:var(--green);flex-shrink:0;margin-top:1px;}

.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.icon-btn{border:1px solid var(--line);background:#fff;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);}
.icon-btn:hover{background:var(--bg);color:var(--text);}
.icon-btn svg{width:15px;height:15px;}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:16px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend svg{width:14px;height:14px;flex-shrink:0;}
.legend i{width:9px;height:9px;border-radius:3px;display:block;}

/* ===== Estoque de Partida — mapa Local × Categoria ===== */
.ep-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;}
.ep-back{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex-shrink:0;}
.ep-back:hover{background:var(--bg);color:var(--text);}
.ep-back svg{width:18px;height:18px;}
.ep-head-text{min-width:0;}
.ep-eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--green);text-transform:uppercase;}
.ep-rascunho{background:#fef6e0;color:#a06a12;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:999px;}
.ep-title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:5px 0 0;}
.ep-head-actions{margin-left:auto;display:flex;gap:10px;flex-shrink:0;}
.ep-save{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 1px 2px rgba(22,163,74,.3);}
.ep-save:hover{background:#15803d;}
.ep-chev{display:inline-grid;place-items:center;width:16px;height:16px;transition:transform .18s;}
.ep-chev svg{width:16px;height:16px;}
.ep-chev.down{transform:rotate(180deg);}

.ep-metrics{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.ep-metric{display:flex;align-items:baseline;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px;}
.ep-m-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.ep-m-value{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text);}
.ep-m-value small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}

.ep-tbl{min-width:900px;}
.ep-tbl th.ep-local-h,.ep-tbl th.ep-tot-h{vertical-align:middle;background:#fcfcfd;}
.ep-tbl th.ep-cat{text-align:center;border-left:1px solid var(--line);color:var(--text);font-weight:700;font-size:11px;}
.ep-tbl th.ep-sub{text-align:left;font-size:10px;color:#9ca3af;font-weight:600;padding-top:4px;padding-bottom:8px;}
.ep-tbl th.ep-sub.ep-r{text-align:right;}
.ep-tbl th.ep-tot-h{text-align:right;}
.ep-tbl th.ep-local-h{text-align:left;}
.ep-group td{background:#f4f6f8;padding:9px 18px;font-size:12.5px;}
.ep-group-label{font-weight:700;color:var(--green);font-size:11px;letter-spacing:.05em;}
.ep-loc-row td{border-bottom:1px solid #f1f2f4;}
.ep-local{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;}
.ep-local svg{width:15px;height:15px;color:var(--green);flex-shrink:0;}
.ep-input-cell{padding:6px 10px!important;border-left:1px solid #f4f5f7;}
.ep-in{width:62px;border:1px solid transparent;border-radius:7px;padding:6px 8px;font-size:13px;font-family:inherit;font-variant-numeric:tabular-nums;color:var(--text);background:transparent;text-align:left;}
.ep-in.ep-peso{text-align:right;width:72px;}
.ep-in:hover{background:#f7f8fa;}
.ep-in:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12);}
.ep-r{text-align:right;}
td.ep-tot{font-weight:600;color:var(--text);background:#fcfcfd;}
.ep-total-row td{border-top:2px solid var(--line);background:#f9fafb;padding-top:13px;padding-bottom:13px;font-size:14px;}

/* toggle de modo Mapa de Pasto / Distribuição por Categoria */
.ep-modo-wrap{margin-left:auto;display:flex;align-items:center;gap:12px;}
.ep-modo-q{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.ep-modo{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
.ep-modo button{display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;padding:9px 15px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap;}
.ep-modo button:last-child{border-right:none;}
.ep-modo button svg{width:15px;height:15px;}
.ep-modo button:hover{background:#f7f8fa;color:var(--text);}
.ep-modo button.on{background:var(--green);color:#fff;}
.ep-modo button.on svg{color:#fff;}
.ep-group-note{color:var(--muted);font-weight:500;}
.empty-cat-row td{color:var(--muted);text-align:center;padding:16px 14px!important;font-size:12.5px;}

/* ===== Gestão de Lotes 2 ===== */
.tag.roxo{background:#efe9fb;color:#7c3aed;}
.tag.amber{background:#fef3e2;color:#b45309;}
.lt-layout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start;}
@media(max-width:1080px){.lt-layout{grid-template-columns:1fr;}}
.lt-list{display:flex;flex-direction:column;gap:10px;}
.lt-list-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.lt-item{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:7px;transition:all .12s;}
.lt-item:hover{border-color:#cbd2da;box-shadow:var(--shadow);}
.lt-item.sel{border-color:#9ca3af;box-shadow:0 0 0 2px rgba(107,114,128,.14);background:#fcfcfd;}
.lt-item.enc{opacity:.62;}
.lt-item-top{display:flex;align-items:center;gap:8px;}
.lt-cod{font-size:12.5px;font-weight:700;color:var(--text);}
.lt-item-nome{font-weight:600;font-size:14px;}
.lt-item-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);}
.lt-item-meta span{display:inline-flex;align-items:center;gap:5px;}
.lt-item-meta svg{width:13px;height:13px;}
.lt-pend{color:var(--pend)!important;font-weight:600;}

.lt-ficha-head{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.lt-fh-id{display:flex;align-items:center;gap:14px;min-width:0;}
.lt-fh-cod{width:54px;height:54px;border-radius:12px;background:#f1f3f5;color:#4b5563;display:grid;place-items:center;font-size:15px;font-weight:700;flex-shrink:0;}
.lt-fh-nome{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.lt-fh-sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.lt-fh-sub svg{width:14px;height:14px;color:#9ca3af;}
.lt-fh-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0;}
.lt-id-note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#4b5563;background:#f8f9fa;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:16px;line-height:1.5;}
.lt-id-note svg{width:16px;height:16px;color:#9ca3af;flex-shrink:0;margin-top:1px;}

.lt-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
.lt-controls.lt-controls-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1280px){.lt-controls,.lt-controls.lt-controls-4{grid-template-columns:1fr 1fr;}}
@media(max-width:840px){.lt-controls,.lt-controls.lt-controls-4{grid-template-columns:1fr;}}
.lt-fh-obs{font-size:12.5px;color:#4b5563;margin-top:6px;display:flex;align-items:flex-start;gap:6px;line-height:1.5;max-width:560px;}
.lt-fh-obs svg{width:13px;height:13px;color:#9ca3af;flex-shrink:0;margin-top:2px;}
.lt-cc{background:#fff;border:1px solid var(--line);border-top:3px solid #d1d5db;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.lt-cc.laranja{border-top-color:#9ca3af;}
.lt-cc.azul{border-top-color:#9ca3af;}
.lt-cc.verde{border-top-color:#9ca3af;}
.lt-cc-head{display:flex;align-items:flex-start;gap:11px;}
.lt-cc-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;}
.lt-cc.laranja .lt-cc-ic{background:#f1f3f5;color:#4b5563;}
.lt-cc.azul .lt-cc-ic{background:#f1f3f5;color:#4b5563;}
.lt-cc.verde .lt-cc-ic{background:#f1f3f5;color:#4b5563;}
.lt-cc-ic svg{width:19px;height:19px;}
.lt-cc-title{font-weight:700;font-size:14.5px;}
.lt-cc-q{font-size:12px;color:var(--muted);margin-top:1px;}
.lt-cc-body{flex:1;display:flex;flex-direction:column;gap:8px;}
.lt-cc-main{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.05;}
.lt-cc-main small{font-size:14px;color:var(--muted);font-weight:600;}
.lt-cc-main.lt-cc-text{font-size:16px;font-weight:600;line-height:1.3;}
.lt-cc-tags{display:flex;flex-wrap:wrap;gap:6px;}
.lt-cc-pend{font-size:12px;color:var(--pend);font-weight:600;display:flex;align-items:center;gap:5px;}
.lt-cc-pend svg,.lt-cc-tags svg{width:13px;height:13px;}
.lt-cc-foot{display:flex;flex-direction:column;gap:9px;border-top:1px solid #f1f2f4;padding-top:11px;}
.lt-cc-evento{font-size:11px;color:#9ca3af;display:flex;align-items:center;gap:5px;}
.lt-cc-evento svg{width:12px;height:12px;}
.lt-cc-evento b{color:#6b7280;font-weight:600;}
.lt-cc-foot .btn{width:100%;justify-content:center;}

.lt-timeline{padding:8px 18px 16px;}
.lt-tl{display:flex;flex-direction:column;}
.lt-tl-item{display:flex;gap:14px;}
.lt-tl-rail{display:flex;flex-direction:column;align-items:center;}
.lt-tl-dot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;border:1px solid var(--line);background:#f4f5f7;color:#6b7280;}
.lt-tl-dot svg{width:16px;height:16px;}
.lt-tl-dot.azul{background:#f4f5f7;color:#6b7280;border-color:var(--line);}
.lt-tl-dot.verde{background:#f4f5f7;color:#6b7280;border-color:var(--line);}
.lt-tl-dot.roxo{background:#f4f5f7;color:#6b7280;border-color:var(--line);}
.lt-tl-dot.laranja{background:#f4f5f7;color:#6b7280;border-color:var(--line);}
.lt-tl-line{flex:1;width:2px;background:#eef0f2;margin:3px 0;}
.lt-tl-body{padding-bottom:18px;flex:1;}
.lt-tl-top{display:flex;align-items:baseline;gap:10px;}
.lt-tl-titulo{font-weight:600;font-size:13.5px;}
.lt-tl-data{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;}
.lt-tl-meta{font-size:12.5px;color:#4b5563;margin-top:2px;}
.lt-tl-resp{font-size:11.5px;color:#9ca3af;margin-top:4px;display:flex;align-items:center;gap:5px;}
.lt-tl-resp svg{width:12px;height:12px;}
.lt-decide{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#4b5563;background:#f8f9fa;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:14px;line-height:1.5;}
.lt-decide svg{width:16px;height:16px;color:#9ca3af;flex-shrink:0;margin-top:1px;}
.lt-modo{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px;}
.lt-modo-btn{display:inline-flex;align-items:center;gap:7px;border:none;background:#fff;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);font-family:inherit;}
.lt-modo-btn:last-child{border-right:none;}
.lt-modo-btn svg{width:15px;height:15px;}
.lt-modo-btn.on{background:#374151;color:#fff;}
.lt-an-list{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;}
.lt-an-filtro{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#6b7280;margin:0 0 10px;cursor:pointer;}
.lt-an-filtro input{width:15px;height:15px;accent-color:#4b5563;cursor:pointer;}
.lt-an-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f1f2f4;cursor:pointer;font-size:13px;}
.lt-an-row:last-child{border-bottom:none;}
.lt-an-row:hover{background:#fafbfc;}
.lt-an-row.on{background:#f4f5f7;}
.lt-an-row input{width:16px;height:16px;accent-color:#4b5563;cursor:pointer;flex-shrink:0;}
.lt-an-id{font-weight:700;color:#374151;flex:0 0 64px;}
.lt-an-br{flex:0 0 86px;}
.lt-an-meta{color:var(--muted);font-size:12px;margin-left:auto;text-align:right;}
.lt-an-sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;}
.lt-an-sel-head{font-size:12px;font-weight:600;color:var(--text);width:100%;}
.lt-cc-ids{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.lt-cc-ids-head{font-size:12px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:5px;width:100%;}
.lt-cc-ids-head svg{width:13px;height:13px;color:#9ca3af;}
.lt-cc-foot .btn{width:100%;}
.ep-cat-tbl{min-width:640px;}
.ep-cat-tbl thead th{text-align:right;}
.ep-cat-tbl thead th.ep-local-h{text-align:left;}
.ep-cat-tbl thead th:nth-child(2){text-align:left;}

/* lookup field (código + lupa + descrição) — padrão legado */
.nasc-form{display:flex;flex-direction:column;gap:16px;}
.nf-row{display:flex;gap:18px;align-items:flex-start;}
.nf-row .field{flex:1;min-width:0;}
.lookup{display:flex;gap:8px;align-items:center;}
.lookup .lk-cod{width:84px;flex:0 0 auto;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;}
.lookup .lk-btn{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--blue);display:grid;place-items:center;}
.lookup .lk-btn:hover{background:var(--blue-soft);border-color:var(--blue-line);}
.lookup .lk-btn svg{width:17px;height:17px;}
.lookup .lk-name{flex:1;min-width:0;background:var(--bg);color:#4b5563;font-weight:500;}
.lk-list{display:flex;flex-direction:column;gap:5px;max-height:52vh;overflow:auto;margin:4px 0;}
.lk-row{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;font-size:13.5px;color:var(--text);}
.lk-row:hover{background:var(--blue-soft);border-color:var(--blue-line);}
.lk-row .mono{color:var(--blue);font-weight:600;min-width:34px;}
.field input:disabled{background:#eef0f2;color:#9ca3af;cursor:not-allowed;}

/* ===== Atribuição de ID — radios em linha + caixa de peso ===== */
.radio-row{display:flex;gap:18px;align-items:center;padding-top:9px;flex-wrap:wrap;}
.radio-opt{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--text);cursor:pointer;user-select:none;}
.radio-opt input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid #c4cad3;border-radius:50%;margin:0;display:grid;place-items:center;cursor:pointer;transition:border-color .12s;}
.radio-opt input:checked{border-color:var(--blue);}
.radio-opt input:checked::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue);}
.weight-box{
  background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;
  display:flex;align-items:center;padding:10px 16px;gap:8px;min-width:200px;
}
.weight-box input{border:none;background:transparent;font-size:30px;font-weight:700;color:var(--text);width:100%;outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.weight-box input::placeholder{color:#9aa4b2;}
.weight-box .unit{font-size:22px;font-weight:700;color:var(--blue);}
.btn.add-big{padding:14px 26px;font-size:15px;border-radius:12px;}
.btn.add-big svg{width:19px;height:19px;}
.req{color:var(--crit);font-weight:700;}
.atrib-wrap{padding:20px;}
.atrib-form{display:flex;flex-direction:column;gap:18px;}
.atrib-foot{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;}

/* Nascimento — resumo total/categorias */
.nasc-resumo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:9px;}
.nasc-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f1f3f5;color:#4b5563;}
.nasc-tag svg{width:13px;height:13px;}
.nasc-tag.ok{background:var(--green-soft);color:var(--green);}
.nasc-tag.muted{background:#eef0f2;color:#6b7280;}
.nasc-tag.crit{background:#fdecec;color:var(--crit);}
.nasc-opt{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;background:#fcfcfd;display:flex;flex-direction:column;gap:12px;}
.nasc-opt-head{font-size:12.5px;font-weight:600;color:#374151;}

/* Toggle "Distribuição vem do ID" */
.toggle-btn{display:inline-flex;align-items:center;gap:8px;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;}
.toggle-btn:hover{background:var(--bg);color:var(--text);}
.toggle-btn svg{width:17px;height:17px;}
.toggle-btn.on{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue);}
.toggle-btn.on svg{color:var(--blue);}
.toggle-btn.icon-only{width:40px;padding:0;justify-content:center;}
.toggle-btn.icon-only svg{width:26px;height:26px;}
.nasc-inline{border:1px dashed var(--blue-line);border-radius:10px;padding:14px 16px;background:#f7faff;display:flex;flex-direction:column;gap:12px;margin-top:8px;}
.li-head{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.li-edit{border:1px solid var(--blue-line);background:#fff;color:var(--blue);width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;}
.li-edit:hover{background:var(--blue-soft);}
.li-edit svg{width:15px;height:15px;}
.li-head .opt{font-weight:500;font-size:11.5px;color:#9ca3af;letter-spacing:0;}
.li-divider{height:1px;background:var(--blue-line);opacity:.6;margin:2px 0;}

/* Dados Adicionais — seção verde recolhível */
.dados-add{margin-top:2px;}
.dados-toggle{display:inline-flex;align-items:center;gap:8px;width:auto;border:1px solid #b7e0c4;background:#f1faf4;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--green);}
.dados-toggle:hover{background:#e7f6ec;}
.dados-toggle .da-chev{display:inline-grid;place-items:center;width:15px;height:15px;transition:transform .18s;}
.dados-toggle .da-chev svg{width:15px;height:15px;}
.dados-toggle .da-chev.open{transform:rotate(180deg);}
.da-body{border:1px solid #b7e0c4;border-radius:10px;background:#fcfffd;padding:16px;margin-top:10px;}
.da-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px;}
.da-grid .full2{grid-column:span 2;}
.da-grid .full3{grid-column:1/-1;}
.da-grid .field label{font-size:12px;}
.da-grid textarea{resize:vertical;}

/* Modal de configuração de campos — modelo em tabela */
.modal:has(.cfg-table){width:920px;}
.cfg-table{width:100%;border-collapse:collapse;font-size:13px;}
.cfg-table thead th{text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6b7280;padding:10px 8px;border-bottom:1px solid var(--line);background:#fcfcfd;}
.cfg-table thead th:first-child{text-align:left;}
.cfg-table tbody td{padding:8px;border-bottom:1px solid #f1f2f4;text-align:center;}
.cfg-table tbody tr:hover{background:#fafbfc;}
.cfg-fname{text-align:left!important;font-weight:600;color:var(--text);white-space:nowrap;}
.cfg-type{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;color:#9ca3af;background:#f1f3f5;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle;}
.cfg-autonum-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:6px;padding:2px 7px;margin-left:8px;cursor:pointer;vertical-align:middle;}
.cfg-autonum-chip input{width:13px;height:13px;margin:0;accent-color:var(--blue);cursor:pointer;}
.cfg-pill{width:100%;max-width:150px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;font-size:13px;font-weight:600;color:#6b7280;transition:all .12s;}
.cfg-pill:hover{border-color:#cbd2da;background:#fafbfc;}
.cfg-pill.on.superior{background:#fef6e0;border-color:#f3d98a;color:#a06a12;box-shadow:0 1px 2px rgba(160,106,18,.12);}
.cfg-pill.on.tabela{background:#e3f7ea;border-color:#9bdcb2;color:#15803d;box-shadow:0 1px 2px rgba(21,128,61,.12);}
.cfg-pill.on.adicionais{background:#eaf1fb;border-color:#bcd6f7;color:var(--blue);box-shadow:0 1px 2px rgba(37,99,235,.12);}
.cfg-pill.on.off{background:#fdecec;border-color:#f3c0c0;color:var(--crit);box-shadow:0 1px 2px rgba(220,38,38,.12);}
.inline-top{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
.inline-entry{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding-bottom:4px;}

/* Compact detail table — fits narrow panes without scroll */
.compact-tbl{width:100%;table-layout:fixed;}
.compact-tbl th,.compact-tbl td{padding:7px 8px;font-size:11.5px;white-space:normal;word-break:break-word;}
.compact-tbl th{letter-spacing:.02em;}
.compact-tbl .mono{font-size:11px;}
.inline-top .field,.inline-entry .field{min-width:0;}
.inline-top .field label,.inline-entry .field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Segmented control (Porte, Colostro, Pesagem) */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;height:38px;}
.seg label{display:grid;place-items:center;padding:0 9px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--line);white-space:nowrap;}

/* Compact inline detail rows — fit without horizontal scroll */
.inline-entry .field label,.inline-top .field label{font-size:11px;}
.inline-entry .field input,.inline-entry .field select{font-size:12.5px;padding:7px 8px;height:38px;}
.inline-entry .seg{height:38px;}
.inline-entry{gap:9px;}
.seg label:last-child{border-right:none;}
.seg input{display:none;}
.seg label:has(input:checked){background:var(--blue);color:#fff;}
.seg label:has(input:checked) .seg-ok{color:#fff;}
.seg .seg-ok{color:var(--green);}
.seg label:has(input:checked) .seg-ok::before{content:"● ";}
.atrib-tally{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 18px 14px;}

/* Histórico recolhível (Lançamentos recentes) */
.hist-panel{overflow:hidden;}
.hist-bar{display:flex;align-items:center;gap:12px;width:100%;border:none;background:#fff;padding:15px 18px;cursor:pointer;text-align:left;font-family:inherit;border-radius:14px;transition:background .12s;}
.hist-bar:hover{background:#f7f9fc;}
.hist-bar.open{border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;}
.hist-bar-chev{display:grid;place-items:center;color:var(--muted);transition:transform .18s;flex-shrink:0;}
.hist-bar-chev svg{width:18px;height:18px;}
.hist-bar.open .hist-bar-chev{transform:rotate(180deg);}
.hist-bar-title{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:var(--text);flex-shrink:0;}
.hist-bar-title svg{width:16px;height:16px;color:var(--muted);}
.hist-bar-sum{font-size:13px;color:var(--muted);flex:1;}
.hist-bar-sum b{font-variant-numeric:tabular-nums;}
.hist-bar-action{font-size:12.5px;font-weight:600;color:var(--blue);background:#eef4fe;border-radius:999px;padding:5px 13px;flex-shrink:0;}
.hist-body{padding:0;}
@media(max-width:760px){.hist-bar{flex-wrap:wrap;gap:8px;}.hist-bar-sum{flex-basis:100%;order:3;}}
.atrib-decl{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:6px;}

/* Atribuir ID — parâmetros compartilhados + linha de entrada */
.atrib-shared{background:#f7faff;border:1px solid var(--blue-line);border-radius:10px;margin:0 18px 12px;padding:12px 16px;}
.ash-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--blue);margin-bottom:8px;}
.ash-head svg{width:14px;height:14px;}
.atrib-entry{gap:14px;padding:4px 18px 16px;}
.atrib-entry .field label{white-space:nowrap;}

/* Sanitário — seção colapsável dentro da Atribuição de ID */
.san-section{border-bottom:1px solid var(--line);background:#fcfcfd;}
.san-toggle{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;padding:15px 18px;font-size:15px;font-weight:700;color:var(--blue);text-align:left;}
.san-toggle:hover{background:#f4f7fc;}
.san-chev{display:grid;place-items:center;transition:transform .18s;color:var(--blue);}
.san-chev svg{width:18px;height:18px;}
.san-chev.open{transform:rotate(0deg);}
.san-chev:not(.open){transform:rotate(-90deg);}
.san-title{letter-spacing:-.01em;}
.san-body{padding:4px 18px 20px;display:flex;flex-direction:column;gap:16px;}
.field select:disabled,.field textarea:disabled{background:#eef0f2;color:#9ca3af;cursor:not-allowed;}
.icon-btn.danger-ic{color:var(--crit);border-color:#f3c6c6;}
.icon-btn.danger-ic:hover{background:#fef2f2;}

/* ===== Ficha Animal — modal com abas ===== */
.modal:has(.ficha-modal){width:780px;}
.ficha-tabs{margin-bottom:18px;flex-wrap:wrap;gap:0;}
.ficha-tabs .tab{padding:9px 13px;font-size:13px;}
.fv-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.fv-card{padding:16px 18px;}
.fv-card h4{margin:0 0 6px;font-size:13.5px;color:var(--text);}
.fv-card + .fv-card{margin-top:14px;}
.fv-empty{color:#b6bcc6;font-weight:500;font-style:italic;}
.fv-link{color:var(--blue);font-weight:600;cursor:pointer;}
.fv-link:hover{text-decoration:underline;}
.fv-note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#6b7280;line-height:1.5;margin-top:14px;padding:11px 13px;background:var(--blue-soft,#eef4fe);border-radius:10px;}
.fv-note svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;color:var(--blue);}
/* foto */
.fv-fotocard{margin-top:14px;}
.fv-foto{width:100%;height:140px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--line);}
.fv-foto-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#f7f8fa;color:#b6bcc6;border-style:dashed;}
.fv-foto-empty svg{width:34px;height:34px;}
.fv-foto-empty span{font-size:12px;font-weight:500;}
/* curva de peso */
.fv-curva{display:flex;flex-direction:column;gap:12px;}
.fv-spark{width:100%;height:120px;}
.fv-curva-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 18px;}
/* timeline */
.fv-tl{display:flex;flex-direction:column;}
.fv-tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f1f2f4;}
.fv-tl-item:last-child{border-bottom:none;}
.fv-tl-dot{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:#eef1f5;color:#6b7280;}
.fv-tl-dot svg{width:17px;height:17px;}
.fv-tl-dot.compra,.fv-tl-dot.nascimento{background:#e3f7ea;color:#15803d;}
.fv-tl-dot.venda,.fv-tl-dot.morte{background:#fdecec;color:var(--crit);}
.fv-tl-dot.alocacao{background:#fff2e0;color:#a06a12;}
.fv-tl-body{flex:1;min-width:0;}
.fv-tl-top{display:flex;align-items:baseline;gap:10px;}
.fv-tl-titulo{font-weight:600;font-size:13.5px;}
.fv-tl-data{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;}
.fv-tl-meta{font-size:12.5px;color:#4b5563;margin-top:2px;}
@media(max-width:680px){.fv-grid{grid-template-columns:1fr;}}

/* progênies + IEP */
.fv-iep h4{display:flex;align-items:center;gap:7px;}
.fv-iep h4 svg{width:16px;height:16px;color:var(--blue);}
.fv-iep-num{font-size:34px;font-weight:700;color:var(--text);line-height:1.1;font-variant-numeric:tabular-nums;}
.fv-iep-num span{font-size:15px;font-weight:600;color:var(--muted);}
.fv-iep-num.fv-iep-na{color:#c2c7d0;}
.fv-iep-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.fv-iep-gaps{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.fv-iep-chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#4b5563;background:#f4f6f8;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-variant-numeric:tabular-nums;}
.fv-iep-chip b{color:var(--blue);}
.fv-prog-tbl{margin-top:4px;}
.fv-prog-tbl th,.fv-prog-tbl td{padding:9px 10px;}
.fv-prog-tbl tbody tr:hover{background:#f7f9fc;}

/* parto histórico */
.fv-card-head{display:flex;align-items:center;justify-content:space-between;}
.fv-hist-badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:#92710c;background:#fcf3da;border:1px solid #f0e0a8;border-radius:6px;padding:1px 7px;vertical-align:middle;}
.fv-hist-note{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#6b7280;line-height:1.5;margin-top:12px;padding:10px 12px;background:#fbf8f0;border:1px solid #f0e8d4;border-radius:9px;}
.fv-hist-note svg{width:14px;height:14px;flex-shrink:0;margin-top:1px;color:#b08a1e;}
.fv-histform{border:1px dashed var(--line);border-radius:11px;padding:14px 15px;background:#fafbfc;}
.fv-histform-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin-bottom:12px;}
.fv-histform-head svg{width:16px;height:16px;color:#b08a1e;}
.fv-histform-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
.fv-prog-tbl td .icon-btn{padding:4px;}

/* ===== Editor de campos da ficha ===== */
.fc-tabpill{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:1px 6px;vertical-align:middle;}
.fc-tabpill.dim{color:var(--alerta);background:#fdf2e3;}
.fc-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.fc-count{font-size:13px;color:var(--text);font-weight:500;}
.fc-count b{color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums;}
.fc-bulk{display:flex;gap:8px;}
.fc-bulk button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .12s;}
.fc-bulk button:hover{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line);}
.fc-group{margin-bottom:18px;}
.fc-group:last-child{margin-bottom:2px;}
.fc-group-h{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;}
.fc-row{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;transition:background .12s,border-color .12s;}
.fc-row + .fc-row{margin-top:7px;}
.fc-row:hover{background:#fafbfd;border-color:var(--blue-line);}
.fc-row.off{background:#fbfcfd;}
.fc-row.off .fc-label{color:var(--muted);}
.fc-label{font-size:13.5px;font-weight:500;color:var(--text);}
.fc-spacer{margin-left:auto;}
.fc-tag{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:2px 7px;}
.fc-tag.req{color:var(--muted);background:#eef0f4;}
.fc-tag.calc{color:var(--blue);background:var(--blue-soft);}
.fc-tag.sec{color:#7c5cd6;background:#f0ecfb;}
/* switch */
.fc-sw{position:relative;display:inline-block;width:38px;height:22px;flex:none;}
.fc-sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.fc-track{position:absolute;inset:0;background:#d3d8e0;border-radius:999px;transition:background .16s;pointer-events:none;}
.fc-track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(20,30,50,.25);transition:transform .16s;}
.fc-sw input:checked + .fc-track{background:var(--blue);}
.fc-sw input:checked + .fc-track::after{transform:translateX(16px);}
.fc-sw input:disabled{cursor:not-allowed;}
.fc-sw input:disabled + .fc-track{background:var(--blue);opacity:.4;}

</style>
</head>

const ENTRADAS = ['nascimento','compra'];

function saldoCategoria(catId){
  const c = DB.categorias.find(c=>c.id===catId);
  let s = c ? c.estoquePartida : 0;
  for(const m of DB.movimentos){
    if(ENTRADAS.includes(m.tipo)) s += entradaContribCat(m, catId);
    else if(SAIDAS.includes(m.tipo) && m.categoria===catId) s -= m.qtd;
  }
  return s;
}

/* categoria de um animal pelo seu cadastro */
function animalCat(id){ const a=DB.animais.find(a=>a.id===id); return a?a.categoria:null; }

/* quanto um movimento de entrada contribui para uma categoria:
   - detalhe (animais com ID) sempre conta na categoria REAL do animal
   - o restante declarado (catDecl) ainda não detalhado conta na categoria declarada
   - movimento "total" (categoria null, sem declaração) só conta o que foi detalhado */
function entradaContribCat(m, catId){
  if(m.catDecl && m.catDecl.length){
    const declared = m.catDecl.filter(d=>d.catId===catId).reduce((a,d)=>a+d.qtd,0);
    const detailed = m.vinculados.filter(id=>animalCat(id)===catId).length;
    return detailed + Math.max(0, declared - detailed);
  }
  if(m.categoria===catId) return m.qtd;
  if(m.categoria==null && m.tipo==='nascimento')
    return m.vinculados.filter(id=>animalCat(id)===catId).length;
  return 0;
}

/* parte de um movimento que ainda não pertence a nenhuma categoria (a detalhar) */
function semCategoriaContrib(m){
  let cats = 0;
  for(const c of DB.categorias) cats += entradaContribCat(m, c.id);
  return Math.max(0, m.qtd - cats);
}
function semCategoriaTotal(){
  let s = 0;
  for(const m of DB.movimentos) if(ENTRADAS.includes(m.tipo)) s += semCategoriaContrib(m);
  return s;
}

/* estoque total é agnóstico de categoria: partida + entradas − saídas (a quantidade é a âncora) */

  let s = DB.categorias.reduce((a,c)=>a+c.estoquePartida,0);
  for(const m of DB.movimentos){
    if(ENTRADAS.includes(m.tipo)) s += m.qtd;
    else if(SAIDAS.includes(m.tipo)) s -= m.qtd;
  }
  return s;
}
function saldoLote(loteId){
  let s = 0;
  for(const m of DB.movimentos){
    if(m.loteDestino===loteId && (ENTRADAS.includes(m.tipo)||m.tipo==='alocacao')) s += m.qtd;
    if(m.loteOrigem===loteId && (SAIDAS.includes(m.tipo)||m.tipo==='alocacao')) s -= m.qtd;
  }
  return s;
}

/* lote atual do animal = último movimento que o vinculou */
function loteAtualAnimal(animalId){
  let lote = null, last = '';
  for(const m of DB.movimentos){
    if(!m.vinculados.includes(animalId)) continue;
    if(m.data >= last){ last = m.data; if(m.loteDestino) lote = m.loteDestino; else if(m.loteOrigem && SAIDAS.includes(m.tipo)) lote = '—'; }
  }
  return lote;
}

function nomeCategoria(id){ const c=DB.categorias.find(c=>c.id===id); return c?c.nome:'—'; }

}

/* cobertura individual = (estoque − não identificados) ÷ estoque */
function coberturaGlobal(){
  const est = estoqueTotal();
  const ni = naoIdentificadosPendentes();
  return est>0 ? ((est-ni)/est)*100 : 100;
}
function classifCobertura(pct){
  if(pct>98) return {label:'Excelente', cls:'ok'};
  if(pct>=95) return {label:'Bom', cls:'ok'};
  if(pct>=90) return {label:'Atenção', cls:'alerta'};
  return {label:'Crítico', cls:'crit'};
}

/* GMD a partir de pesagens */
function gmdAnimal(animalId){
  const ps = DB.pesagens.filter(p=>p.animal===animalId).sort((a,b)=>a.data.localeCompare(b.data));
  if(ps.length<2) return null;
  const a=ps[0], b=ps[ps.length-1];
  const dias = (new Date(b.data)-new Date(a.data))/86400000;
  if(dias<=0) return null;
  return { gmd:(b.peso-a.peso)/dias, dias, pesoIni:a.peso, pesoFim:b.peso, n:ps.length, serie:ps };
}

function statusPill(s){

  return `<span class="pill neutral"><span class="d"></span>${s}</span>`;
}

function toast({title, msg, kind='ok', timeout=5200}){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const el = document.createElement('div');
  el.className = `toast ${kind==='ok'?'':kind}`;
  const ic = kind==='ok' ? 'checkCircle' : kind==='crit' ? 'alert' : 'info';
  el.innerHTML = `<span class="t-icon">${icon(ic)}</span>
    <div><div class="t-title">${title}</div>${msg?`<div class="t-msg">${msg}</div>`:''}</div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateX(12px)'; setTimeout(()=>el.remove(),300); }, timeout);
}

/* ===== Modal ===== */
function openModal({title, sub, body, foot}){
  closeModal();
  const back = document.createElement('div');
  back.className='modal-back';
  back.innerHTML = `<div class="modal" role="dialog">
    <div class="modal-head">
      <div><h3>${title}</h3>${sub?`<div class="m-sub">${sub}</div>`:''}</div>
      <button class="x" data-close>${icon('x')}</button>
    </div>
    <div class="modal-body">${body||''}</div>
    ${foot?`<div class="modal-foot">${foot}</div>`:''}
  </div>`;
  back.addEventListener('click', e=>{ if(e.target===back || e.target.closest('[data-close]')) closeModal(); });
  document.body.appendChild(back);
  return back;
}
function closeModal(){ document.querySelector('.modal-back')?.remove(); }

/* page header builder */
function pageHead({title, sub, layer, actions}){
  return `<div class="page-head">
    <div class="ph-text">
      ${layer?`<div style="margin-bottom:9px">${layerBadge(layer)}</div>`:''}
      <h1 class="page-title">${title}</h1>
      ${sub?`<div class="page-sub">${sub}</div>`:''}
    </div>
    ${actions?`<div class="ph-actions">${actions}</div>`:''}
  </div>`;
}

function panelNote(text){
  return `<div class="panel-note">${icon('info')}<span>${text}</span></div>`;
}

function searchBox(ph='Buscar…'){
  return `<div class="search">${icon('search')}<input placeholder="${ph}" oninput="this.value=this.value"></div>`;
}

/* ===== Campo de busca: código + lupa + descrição (padrão legado) ===== */
function lookupField({key, label, src, refId, onPick, cls, defCod='', defNome='', defRef='', noCod=false}){
  const codInput = noCod ? `<input type="hidden" id="${key}-cod" value="${defCod}">`
    : `<input class="lk-cod" id="${key}-cod" value="${defCod}" placeholder="Cód." autocomplete="off"
        oninput="lkResolve('${key}','${src}','${refId||''}','${onPick||''}')">`;
  return `<div class="field ${cls||''}">
    <label>${label}</label>
    <div class="lookup">
      ${codInput}
      <input class="lk-name" id="${key}-name" value="${defNome}" readonly placeholder="—"
        ${noCod?`onclick="lkOpen('${key}','${src}','${label}','${refId||''}','${onPick||''}')" style="cursor:pointer"`:''}>
      <button type="button" class="lk-btn" title="Buscar ${label}"
        onclick="lkOpen('${key}','${src}','${label}','${refId||''}','${onPick||''}')">${icon('search')}</button>
      ${refId?`<input type="hidden" id="${refId}" value="${defRef}">`:''}
    </div>
  </div>`;
}
function lkResolve(key, src, refId, onPick){
  const cod = (document.getElementById(key+'-cod').value||'').trim();
  const item = lkData(src).find(x=>x.cod===cod);
  document.getElementById(key+'-name').value = item ? item.nome : '';
  if(refId) document.getElementById(refId).value = item ? (item.ref||item.cod) : '';
  if(onPick && window[onPick]) window[onPick]();
}
function lkOpen(key, src, label, refId, onPick){
  const items = lkData(src);
  openModal({
    title:`Selecionar ${label}`,
    sub:'Clique para escolher.',
    body:`<div class="lk-list">${items.map(x=>`
      <button class="lk-row" data-nome="${x.nome}"
        onclick="lkPick('${key}','${refId||''}','${onPick||''}','${x.cod}','${x.ref||x.cod}',this)">
        <span class="mono">${x.cod}</span><span>${x.nome}</span></button>`).join('')}</div>`,
  });
}
function lkPick(key, refId, onPick, cod, ref, el){
  document.getElementById(key+'-cod').value = cod;
  document.getElementById(key+'-name').value = el.dataset.nome;
  if(refId) document.getElementById(refId).value = ref;
  closeModal();
  if(onPick && window[onPick]) window[onPick]();
}

/* ---------- Progênies (filhos desta matriz/reprodutor) ---------- */
let FICHA_PROG_ADD = false;

/* progênies vinculadas a animais reais (afetam estoque) */
function progeniesReais(a){
  const chaves = [a.id, a.brinco, a.nome].filter(Boolean);
  return DB.animais
    .filter(x => x.id!==a.id && (chaves.includes(x.mae) || chaves.includes(x.pai)))
    .map(x => ({ id:x.id, nascimento:x.nascimento, categoria:x.categoria, pesoNascer:x.pesoNascer, _hist:false }));
}
/* progênies históricas — fatos registrados só na ficha, NÃO afetam estoque */
function progeniesHistoricas(a){
  return (a.progHistorico||[]).map((h,i) => ({ ...h, _hist:true, _hi:i }));
}
/* lista completa, ordenada por nascimento */
function progeniesDe(a){
  return [...progeniesReais(a), ...progeniesHistoricas(a)]
    .sort((x,y)=>(x.nascimento||'').localeCompare(y.nascimento||''));
}
/* Intervalo entre partos (IEP): média de dias entre nascimentos consecutivos das crias */
function intervaloEntrePartos(progenies){
  const datas = progenies.map(p=>p.nascimento).filter(Boolean).sort();
  if(datas.length<2) return null;
  const gaps = [];
  for(let i=1;i<datas.length;i++){
    const d0=new Date(datas[i-1]).getTime(), d1=new Date(datas[i]).getTime();
    gaps.push(Math.round((d1-d0)/86400000));
  }
  const media = Math.round(gaps.reduce((s,g)=>s+g,0)/gaps.length);
  return { media, gaps, datas };
}
function fichaTabProgenie(a){
  const filhos = progeniesDe(a);
  const iep = intervaloEntrePartos(filhos);
  /* card: Intervalo entre partos */
  const iepValor = iep
    ? `<div class="fv-iep-num">${iep.media} <span>dias</span></div>
       <div class="fv-iep-sub">≈ ${(iep.media/30.4).toFixed(1)} meses · média de ${iep.gaps.length} intervalo(s)</div>
       <div class="fv-iep-gaps">${iep.gaps.map((g,i)=>`<span class="fv-iep-chip">${fmtData(iep.datas[i])} → ${fmtData(iep.datas[i+1])}<b>${g} d</b></span>`).join('')}</div>`
    : `<div class="fv-iep-num fv-iep-na">—</div><div class="fv-iep-sub">São necessários pelo menos 2 partos registrados para calcular o intervalo.</div>`;
  const iepCard = `<div class="aside-card fv-card fv-iep"><h4>${icon('reproducao')} Intervalo entre partos (IEP)</h4>${iepValor}</div>`;
  /* tabela de progênies */
  let tabela;
  if(!filhos.length){
    tabela = '<div class="small" style="color:var(--muted);padding:4px 0 10px">Nenhuma progênie vinculada a este animal ainda.</div>';
  } else {
    const rows = filhos.map((p,i)=>{
      const histBadge = p._hist ? ' <span class="fv-hist-badge">histórico</span>' : '';
      const idCell = p.id
        ? (p._hist ? `<span class="mono">${p.id}</span>` : `<span class="mono" style="color:var(--blue);font-weight:600">${p.id}</span>`)
        : '<span class="fv-empty">sem ID</span>';
      const click = (!p._hist && p.id) ? ` style="cursor:pointer" onclick="openFicha('${p.id}')"` : '';
      const acao = p._hist ? `<td class="num"><button class="icon-btn danger-ic" title="Remover registro histórico" onclick="event.stopPropagation();fichaRemoverHist(${p._hi})">${icon('trash')}</button></td>` : '<td></td>';
      return `<tr${click}>
        <td>${idCell}${histBadge}</td>
        <td>${p.nascimento?fmtData(p.nascimento):'<span class="fv-empty">—</span>'}</td>
        <td>${nomeCategoria(p.categoria)||'<span class="fv-empty">—</span>'}</td>
        <td class="num">${p.pesoNascer!=null&&p.pesoNascer!==''?`${p.pesoNascer} kg`:'<span class="fv-empty">—</span>'}</td>
        ${acao}
      </tr>`;
    }).join('');
    tabela = `<table class="tbl fv-prog-tbl">
        <thead><tr><th>ID</th><th>Data de nascimento</th><th>Categoria</th><th class="num">Peso ao nascer</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }
  /* form inline de parto histórico */
  const form = FICHA_PROG_ADD ? `
    <div class="fv-histform">
      <div class="fv-histform-head">${icon('historico')} Parto histórico <span class="fv-hist-badge">não afeta estoque</span></div>
      <div class="form-grid">
        <div class="field"><label>ID da cria <span class="opt">(opcional)</span></label><input id="ph-id" placeholder="ex.: histórico-01"></div>
        <div class="field"><label>Data de nascimento</label><input id="ph-data" type="date"></div>
        <div class="field"><label>Categoria</label><select id="ph-cat"><option value="">—</option>${DB.categorias.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}</select></div>
        <div class="field"><label>Peso ao nascer (kg) <span class="opt">(opcional)</span></label><input id="ph-peso" type="number" placeholder="—"></div>
      </div>
      <div class="fv-histform-foot">
        <button class="btn ghost" onclick="fichaToggleHist(false)">Cancelar</button>
        <button class="btn primary" onclick="fichaSalvarHist()">${icon('save')} Adicionar</button>
      </div>
    </div>` : `<button class="btn" onclick="fichaToggleHist(true)">${icon('plus')} Adicionar parto histórico</button>`;
  const card = `<div class="aside-card fv-card">
    <div class="fv-card-head"><h4>Progênies <span class="sub-cell">(${filhos.length})</span></h4></div>
    ${tabela}
    <div class="fv-hist-note">${icon('info')}<span>Dados <b>históricos</b> são fatos passados (partos de antes do sistema). Ficam registrados aqui e alimentam o IEP, mas <b>não geram movimento nem entram no estoque</b>. Crias atuais devem ser cadastradas via Nascimento.</span></div>
    <div style="margin-top:12px">${form}</div>
  </div>`;
  const iepBlock = fSec('iep') ? iepCard : '';
  const progBlock = fSec('progTabela') ? `${iepBlock?'<div style="margin-top:14px">':'<div>'}${card}</div>` : '';
  const vazio = (!iepBlock && !progBlock)
    ? '<div class="aside-card fv-card"><div class="small" style="color:var(--muted)">Nenhum bloco ativo nesta aba. Ative em “Configurar campos”.</div></div>' : '';
  return iepBlock + progBlock + vazio;
}

function fichaSalvarHist(){

  FICHA_PROG_ADD = false;

    : '<div class="small" style="color:var(--muted)">Sem pesagens registradas.</div>';

/* mini-gráfico de linha (SVG) das pesagens */
function fichaSparkline(pes){
  const W=520, H=120, pad=14;
  const ps = pes.map(p=>p.peso);
  const min = Math.min(...ps), max = Math.max(...ps);
  const span = (max-min)||1;
  const t0 = new Date(pes[0].data).getTime();
  const t1 = new Date(pes[pes.length-1].data).getTime();
  const tspan = (t1-t0)||1;
  const pts = pes.map(p=>{
    const x = pad + (W-2*pad) * ((new Date(p.data).getTime()-t0)/tspan);
    const y = H-pad - (H-2*pad) * ((p.peso-min)/span);
    return [x,y];
  });
  const path = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="var(--blue)"/>`).join('');
  return `<svg class="fv-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

/* ---------- 6. Histórico (biografia do animal) ---------- */
function fichaTabHist(a){
  if(!fSec('timeline')) return '<div class="aside-card fv-card"><div class="small" style="color:var(--muted)">Linha do tempo desativada em “Configurar campos”.</div></div>';
  const hist = DB.movimentos.filter(m=>m.vinculados.includes(a.id)).sort((x,y)=>y.data.localeCompare(x.data));
  if(!hist.length) return '<div class="aside-card fv-card"><h4>Linha do tempo</h4><div class="small" style="color:var(--muted)">Sem movimentos vinculados a este animal.</div></div>';
  const rows = hist.map(m=>{
    const dest = m.loteDestino?nomeLote(m.loteDestino):null;
    const detalhe = m.origem || m.destino || m.causa || (dest?`→ ${dest}`:'');
    return `<div class="fv-tl-item">
      <div class="fv-tl-dot ${m.tipo}">${icon(m.tipo==='alocacao'?'gestaoLotes':m.tipo)}</div>
      <div class="fv-tl-body">
        <div class="fv-tl-top"><span class="fv-tl-titulo">${tipoLabel(m.tipo)}</span><span class="fv-tl-data">${fmtData(m.data)}</span></div>
        <div class="fv-tl-meta">${detalhe||'—'}${m.responsavel?` · <span class="sub-cell">${m.responsavel}</span>`:''}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="aside-card fv-card"><h4>Linha do tempo de movimentos</h4><div class="fv-tl">${rows}</div></div>`;
}

/* ============================================================

let NF_TAB = 'id';

function proxAnimalId(){

/* input que persiste no rascunho NF */
function nfField(label, key, opts={}){
  if(FICHA_CAMPO_DEF[key] && !fieldOn(key)) return '';
  const v = NF[key] ?? '';
  const ph = opts.ph ? ` placeholder="${opts.ph}"` : '';
  const type = opts.type || 'text';
  const full = opts.full ? ' full' : '';
  const optTag = opts.opt ? ' <span class="opt">(opcional)</span>' : '';
  return `<div class="field${full}"><label>${label}${optTag}</label><input type="${type}" value="${String(v).replace(/"/g,'&quot;')}"${ph} oninput="NF['${key}']=this.value"></div>`;
}
function nfSelect(label, key, options, opts={}){
  if(FICHA_CAMPO_DEF[key] && !fieldOn(key)) return '';
  const v = NF[key];
  const full = opts.full ? ' full' : '';
  const body = options.map(o=>{
    const val = o.val!==undefined ? o.val : o;
    const lab = o.lab!==undefined ? o.lab : o;
    return `<option value="${val}" ${v==val?'selected':''}>${lab}</option>`;
  }).join('');
  return `<div class="field${full}"><label>${label}</label><select onchange="NF['${key}']=this.value">${body}</select></div>`;
}

function nfTabBody(){

function salvarFichaNova(){

  const num = s => { const n=parseFloat(s); return isNaN(n)?null:n; };
  const clean = s => (s&&String(s).trim()) ? String(s).trim() : null;
  const br = clean(NF.brinco);
  const animal = {
    id, brinco:br, statusBrinco:br?'ok':'sem',
    sexo:NF.sexo, categoria:NF.categoria, raca:clean(NF.raca)||'—', vivo:true,
    rfid:clean(NF.rfid), sisbov:clean(NF.sisbov), ferro:clean(NF.ferro), nome:clean(NF.nome),
    rgn:clean(NF.rgn), rgd:clean(NF.rgd), grau:clean(NF.grau),
    nascimento:clean(NF.nascimento), pelagem:clean(NF.pelagem), chifre:clean(NF.chifre), origemTipo:clean(NF.origemTipo),
    pai:clean(NF.pai), mae:clean(NF.mae), concepcao:clean(NF.concepcao), parto:clean(NF.parto),
    entrada:clean(NF.entrada), dataEntrada:clean(NF.dataEntrada), origem:clean(NF.origem),
    proprietario:clean(NF.proprietario), fazenda:clean(NF.fazenda),
    pesoNascer:num(NF.pesoNascer), desmama:clean(NF.desmama), ppt:num(NF.ppt), hematocrito:num(NF.hematocrito),
    progHistorico: (NF.progHistorico||[]).slice(),
  };
  DB.animais.push(animal);
  closeModal(); render();
  toast({title:'Ficha criada',msg:br?`${id} · brinco ${br}`:`${id} entrou sem identificação — normal.`,kind:br?'ok':'warn'});
  openFicha(id);
}

/* ============================================================

   Estado persistido em localStorage (inttegra-ficha-campos).

/* Registro: abas → grupos (cards) → campos.
   req     = obrigatório, sempre ligado (não pode desativar)
   calc    = valor derivado/calculado (informativo no editor)
   section = bloco estrutural (tabela, gráfico, linha do tempo) */
const FICHA_CAMPOS = [
  { tab:'ident', label:'Identificação', grupos:[
    { titulo:'Identificação de rastreabilidade', campos:[
      { key:'id',         label:'ID interno (chave)', req:true },

      { key:'sisbov',     label:'Nº SISBOV' },
      { key:'ferro',      label:'Marcação a ferro' },
      { key:'nome',       label:'Nome do animal' },

    { titulo:'Registro genealógico', campos:[
      { key:'rgn',  label:'RGN (nascimento)' },
      { key:'rgd',  label:'RGD (definitivo)' },
      { key:'grau', label:'Grau de sangue' },
    ]},
    { titulo:'Foto', campos:[
      { key:'foto', label:'Foto do animal' },
    ]},
    { titulo:'Classificação', campos:[
      { key:'sexo',      label:'Sexo / Gênero' },
      { key:'categoria', label:'Categoria animal' },
      { key:'raca',      label:'Raça' },
      { key:'status',    label:'Status do animal', calc:true },
    ]},
    { titulo:'Fisiologia', campos:[
      { key:'nascimento', label:'Data de nascimento' },
      { key:'idade',      label:'Idade', calc:true },
      { key:'pelagem',    label:'Pelagem' },
      { key:'chifre',     label:'Tipo de chifre' },
    ]},
  ]},
  { tab:'geneal', label:'Genealogia', grupos:[
    { titulo:'Filiação', campos:[
      { key:'pai', label:'Pai' },
      { key:'mae', label:'Mãe (matriz)' },
    ]},
    { titulo:'Concepção & parto', campos:[
      { key:'concepcao', label:'Tipo de concepção' },
      { key:'parto',     label:'Condições do parto' },
    ]},
  ]},
  { tab:'progenie', label:'Progênies', grupos:[
    { titulo:'Blocos da aba', campos:[
      { key:'iep',        label:'Intervalo entre partos (IEP)', section:true },
      { key:'progTabela', label:'Tabela de progênies',          section:true },
    ]},
  ]},
  { tab:'origem', label:'Origem & local', grupos:[
    { titulo:'Entrada', campos:[
      { key:'entrada',     label:'Tipo de entrada' },
      { key:'dataEntrada', label:'Data de entrada' },
      { key:'origem',      label:'Produtor / fazenda de origem' },
    ]},
    { titulo:'Localização atual', campos:[
      { key:'proprietario', label:'Proprietário' },
      { key:'fazenda',      label:'Fazenda' },
      { key:'lote',         label:'Lote / grupo de manejo', calc:true },
    ]},
  ]},
  { tab:'biometria', label:'Biometria & saúde', grupos:[
    { titulo:'Pesos & marcos', campos:[
      { key:'pesoNascer',      label:'Peso ao nascer (P.N.)' },
      { key:'primeiraPesagem', label:'1ª pesagem', calc:true },
      { key:'desmama',         label:'Data de desmama' },
      { key:'pesoAtual',       label:'Peso atual', calc:true },
      { key:'gmd',             label:'GMD', calc:true },

    { titulo:'Testes clínicos & saúde', campos:[

  { tab:'hist', label:'Histórico', grupos:[
    { titulo:'Blocos da aba', campos:[
      { key:'timeline', label:'Linha do tempo de movimentos', section:true },
    ]},
  ]},
];

/* índice key → def, para consulta rápida */
const FICHA_CAMPO_DEF = (()=>{ const m={}; FICHA_CAMPOS.forEach(t=>t.grupos.forEach(g=>g.campos.forEach(c=>{ m[c.key]={...c, tab:t.tab}; }))); return m; })();
function fichaCamposTab(tab){ const t = FICHA_CAMPOS.find(x=>x.tab===tab); return t? t.grupos.flatMap(g=>g.campos):[]; }

/* ===== estado ===== */
let FIELD_CFG = {};
try { FIELD_CFG = JSON.parse(localStorage.getItem('inttegra-ficha-campos')||'{}') || {}; } catch(e){ FIELD_CFG = {}; }
function saveFieldCfg(){ try{ localStorage.setItem('inttegra-ficha-campos', JSON.stringify(FIELD_CFG)); }catch(e){} }

/* um campo está ligado? (default = ligado; obrigatórios sempre ligados) */
function fieldOn(key){
  const def = FICHA_CAMPO_DEF[key];
  if(def && def.req) return true;
  return FIELD_CFG[key] !== false;
}
function fieldSet(key, on){
  const def = FICHA_CAMPO_DEF[key];
  if(def && def.req) return;            // obrigatório não muda
  if(on) delete FIELD_CFG[key]; else FIELD_CFG[key] = false;
  saveFieldCfg();
}

/* helpers de render usados pelas views da ficha */
function fRow(key, k, v){ return fieldOn(key) ? kvRow(k, v) : ''; }
function fSec(key){ return fieldOn(key); }
/* card que se oculta sozinho quando não sobra nenhuma linha */
function fichaCardF(titulo, rows){ return (rows && rows.trim()) ? fichaCard(titulo, rows) : ''; }
/* nº de campos ligados / total numa aba (exclui derivados da contagem? não — conta todos) */
function fichaTabCount(tab){
  const cs = fichaCamposTab(tab);
  return { on: cs.filter(c=>fieldOn(c.key)).length, total: cs.length };
}

/* ============================================================
   EDITOR (modal)
   ============================================================ */
let FC_TAB = 'ident';
let FC_BACK = null;   // callback ao concluir (reabre a ficha)

function openFichaCampos(back){
  FC_TAB = 'ident';
  FC_BACK = back || null;
  openModal({
    title:'Configurar campos da ficha',
    sub:'Ative ou desative os campos exibidos em cada aba da Ficha Animal. Vale para a visualização e para o formulário de nova ficha. O ID interno é obrigatório.',
    body:`<div class="ficha-modal fc-editor">
      <div class="tabs ficha-tabs" id="fc-tabwrap">${fcTabsHtml()}</div>
      <div id="fc-body">${fcBody()}</div>
    </div>`,
    foot:`<button class="btn ghost" onclick="fcReset()">${icon('historico')} Restaurar padrão</button><div class="spacer"></div><button class="btn primary" onclick="fcConcluir()">${icon('check')} Concluir</button>`,
  });
}
function fcTabsHtml(){
  return FICHA_CAMPOS.map(t=>{
    const c = fichaTabCount(t.tab);
    const dim = c.on < c.total;
    return `<button class="tab ${t.tab===FC_TAB?'active':''}" onclick="fcSetTab('${t.tab}')">${t.label}
      <span class="fc-tabpill ${dim?'dim':''}">${c.on}/${c.total}</span></button>`;
  }).join('');
}
function fcSetTab(t){ FC_TAB=t; document.getElementById('fc-tabwrap').innerHTML=fcTabsHtml(); document.getElementById('fc-body').innerHTML=fcBody(); }

function fcBody(){
  const t = FICHA_CAMPOS.find(x=>x.tab===FC_TAB);
  const c = fichaTabCount(FC_TAB);
  const toolbar = `<div class="fc-toolbar">
    <div class="fc-count"><b>${c.on}</b> de ${c.total} campos ativos nesta aba</div>
    <div class="fc-bulk">
      <button onclick="fcBulk(true)">Ativar todos</button>
      <button onclick="fcBulk(false)">Desativar todos</button>
    </div>
  </div>`;
  const grupos = t.grupos.map(g=>{
    const rows = g.campos.map(c=>fcRow(c)).join('');
    return `<div class="fc-group"><div class="fc-group-h">${g.titulo}</div><div class="fc-rows">${rows}</div></div>`;
  }).join('');
  return toolbar + grupos;
}
function fcRow(c){
  const on = fieldOn(c.key);
  const tag = c.req ? `<span class="fc-tag req">obrigatório</span>`
    : c.calc ? `<span class="fc-tag calc">calculado</span>`
    : c.section ? `<span class="fc-tag sec">bloco</span>` : '';
  const dis = c.req ? 'disabled' : '';
  const onch = c.req ? '' : `onchange="fcToggle('${c.key}', this.checked)"`;
  return `<label class="fc-row ${on?'':'off'}">
    <span class="fc-label">${c.label}</span>
    ${tag}
    <span class="fc-spacer"></span>
    <span class="fc-sw"><input type="checkbox" ${on?'checked':''} ${dis} ${onch}><span class="fc-track"></span></span>
  </label>`;
}
function fcToggle(key, on){
  fieldSet(key, on);
  document.getElementById('fc-body').innerHTML = fcBody();
  document.getElementById('fc-tabwrap').innerHTML = fcTabsHtml();
}
function fcBulk(on){
  fichaCamposTab(FC_TAB).forEach(c=>{ if(!c.req) fieldSet(c.key, on); });
  document.getElementById('fc-body').innerHTML = fcBody();
  document.getElementById('fc-tabwrap').innerHTML = fcTabsHtml();
}
function fcReset(){
  FIELD_CFG = {}; saveFieldCfg();
  document.getElementById('fc-body').innerHTML = fcBody();
  document.getElementById('fc-tabwrap').innerHTML = fcTabsHtml();
  toast({title:'Campos restaurados', msg:'Todos os campos voltaram a ficar visíveis.'});
}
function fcConcluir(){
  const back = FC_BACK; FC_BACK = null;
  closeModal();
  if(typeof back === 'function') back();
}

/* ===== ESTOQUE DE PARTIDA — mapa Local × Categoria (QTD/Peso) ===== */
const EP = {

  locais: [

};
let EP_COLLAPSED = false;
let EP_MODO = 'pasto';  // 'pasto' (Local × Categoria) | 'categoria' (categorias nas linhas)
EP.catDist = null;       // distribuição agregada por categoria {colId:{qtd,peso}}

function epEnsureCatDist(){
  if(EP.catDist) return;
  EP.catDist = {};
  EP.colunas.forEach(c=>{ EP.catDist[c.id] = { qtd: epColQtd(c.id), peso: epColPesoMedio(c.id) }; });
}
function epCatRowWeight(colId){ const d=EP.catDist[colId]||{}; return (d.qtd||0)*(d.peso||0); }
function epCatGrandQtd(){ return EP.colunas.reduce((a,c)=>a+(EP.catDist[c.id]?.qtd||0),0); }
function epCatGrandWeight(){ return EP.colunas.reduce((a,c)=>a+epCatRowWeight(c.id),0); }
function epCatGrandPesoMedio(){ const q=epCatGrandQtd(); return q>0?epCatGrandWeight()/q:0; }
function epCatGrandLotacao(){ const a=epGrandArea(); const q=epCatGrandQtd(); return a>0&&q>0?q/a:0; }

function epCell(locId, colId){
  const loc = EP.locais.find(l=>l.id===locId);
  return (loc.cells[colId] ||= { qtd:0, peso:0 });
}
function epNum(n, dec=1){
  if(!n || !isFinite(n)) return '—';
  return n.toLocaleString('pt-BR',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function epRowQtd(loc){ return EP.colunas.reduce((a,c)=>a + (loc.cells[c.id]?.qtd||0), 0); }
function epRowWeight(loc){ return EP.colunas.reduce((a,c)=>{ const x=loc.cells[c.id]; return a + (x?(x.qtd||0)*(x.peso||0):0); }, 0); }
function epRowPesoMedio(loc){ const q=epRowQtd(loc); return q>0 ? epRowWeight(loc)/q : 0; }
function epRowLotacao(loc){ const q=epRowQtd(loc); return loc.area>0 && q>0 ? q/loc.area : 0; }

function epColQtd(colId){ return EP.locais.reduce((a,l)=>a+(l.cells[colId]?.qtd||0),0); }
function epColWeightTot(colId){ return EP.locais.reduce((a,l)=>{ const x=l.cells[colId]; return a+(x?(x.qtd||0)*(x.peso||0):0); },0); }
function epColPesoMedio(colId){ const q=epColQtd(colId); return q>0 ? epColWeightTot(colId)/q : 0; }
function epGrandQtd(){ return EP.locais.reduce((a,l)=>a+epRowQtd(l),0); }
function epGrandWeight(){ return EP.locais.reduce((a,l)=>a+epRowWeight(l),0); }
function epGrandArea(){ return EP.locais.reduce((a,l)=>a+(l.area||0),0); }
function epGrandPesoMedio(){ const q=epGrandQtd(); return q>0 ? epGrandWeight()/q : 0; }
function epGrandLotacao(){ const a=epGrandArea(); return a>0 ? epGrandQtd()/a : 0; }

      <div class="ep-modo">
        <button class="${EP_MODO==='pasto'?'on':''}" onclick="epSetModo('pasto')">${icon('mapa')} Mapa de Pasto</button>

}

      <td class="ep-local">${icon('categoria')}<span>${c.nome}</span></td>

      <td class="ep-tot num ep-r" id="ep-cat-${c.id}-ptot">${epNum(epCatRowWeight(c.id))}</td>

        <td class="num strong ep-r" id="ep-cg-ptot">${epNum(epCatGrandWeight())}</td>
