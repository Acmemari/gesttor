function epCatSet(colId, field, raw){
  epEnsureCatDist();
  const d = (EP.catDist[colId] ||= {qtd:0,peso:0});
  d[field] = field==='qtd' ? (parseInt(String(raw).replace(/\D/g,''),10)||0) : epParseNum(raw);
  epCatRecalc();
}
function epCatRecalc(){
  EP.colunas.forEach(c=>{
    const d = EP.catDist[c.id]||{qtd:0,peso:0};
    const lot = epGrandArea()>0 && d.qtd>0 ? d.qtd/epGrandArea() : 0;
    const pt=document.getElementById(`ep-cat-${c.id}-ptot`); if(pt) pt.textContent = epNum(epCatRowWeight(c.id));
    const lo=document.getElementById(`ep-cat-${c.id}-lot`); if(lo) lo.textContent = epNum(lot,2);
  });
  const gq=document.getElementById('ep-cg-qtd'); if(gq) gq.textContent = epCatGrandQtd();
  const gp=document.getElementById('ep-cg-pm'); if(gp) gp.textContent = epNum(epCatGrandPesoMedio());
  const gpt=document.getElementById('ep-cg-ptot'); if(gpt) gpt.textContent = epNum(epCatGrandWeight());
  const gl=document.getElementById('ep-cg-lot'); if(gl) gl.textContent = epNum(epCatGrandLotacao(),2);
  const mc=document.getElementById('ep-m-cabecas'); if(mc) mc.textContent = epCatGrandQtd();
  const mp=document.getElementById('ep-m-pm'); if(mp) mp.innerHTML = `${epNum(epCatGrandPesoMedio())}<small>kg</small>`;
  const ml=document.getElementById('ep-m-lot'); if(ml) ml.innerHTML = `${epNum(epCatGrandLotacao(),2)}<small>cab/ha</small>`;
}

function epTable(){
  const colHead = EP.colunas.map(c=>`<th class="ep-cat" colspan="2">${c.nome}</th>`).join('');
  const subHead = EP.colunas.map(()=>`<th class="ep-sub">QTD</th><th class="ep-sub ep-r">Peso (kg)</th>`).join('');
  const rows = EP.locais.map(loc=>{
    const cells = EP.colunas.map(c=>{
      const v = loc.cells[c.id] || {qtd:0,peso:0};
      return `<td class="ep-input-cell">
          <input class="ep-in" type="text" inputmode="numeric" value="${v.qtd||''}" placeholder="—"

        </td>
        <td class="ep-input-cell ep-r">
          <input class="ep-in ep-peso" type="text" inputmode="decimal" value="${v.peso?epNum(v.peso):''}" placeholder="—"

        </td>`;
    }).join('');
    return `<tr class="ep-loc-row">
      <td class="ep-local">${icon('local')}<span>${loc.nome}</span></td>
      ${cells}
      <td class="ep-tot num" id="ep-${loc.id}-total">${epRowQtd(loc)||'—'}</td>
      <td class="ep-tot num" id="ep-${loc.id}-pm">${epNum(epRowPesoMedio(loc))}</td>
      <td class="ep-tot num ep-r" id="ep-${loc.id}-lot">${epNum(epRowLotacao(loc),2)}</td>
    </tr>`;
  }).join('');
  const colTotals = EP.colunas.map(c=>`<td class="num strong" id="ep-col-${c.id}-q">${epColQtd(c.id)||'—'}</td><td class="num strong ep-r" id="ep-col-${c.id}-p">${epNum(epColPesoMedio(c.id))}</td>`).join('');
  return `<table class="tbl ep-tbl">
    <thead>
      <tr><th class="ep-local-h" rowspan="2">Local</th>${colHead}<th class="ep-tot-h" rowspan="2">Total</th><th class="ep-tot-h" rowspan="2">Peso médio</th><th class="ep-tot-h ep-r" rowspan="2">Lotação</th></tr>
      <tr>${subHead}</tr>
    </thead>
    <tbody>
      ${EP_COLLAPSED?'':rows}
    </tbody>
    <tfoot>
      <tr class="ep-total-row">
        <td class="strong">Total</td>
        ${colTotals}
        <td class="num strong" id="ep-g-qtd">${epGrandQtd()}</td>
        <td class="num strong" id="ep-g-pm">${epNum(epGrandPesoMedio())}</td>
        <td class="num strong ep-r" id="ep-g-lot">${epNum(epGrandLotacao(),2)}</td>
      </tr>
    </tfoot>
  </table>`;
}

function epParseNum(s){ return parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0; }
function epSet(locId, colId, field, raw){
  const cell = epCell(locId, colId);
  cell[field] = field==='qtd' ? (parseInt(String(raw).replace(/\D/g,''),10)||0) : epParseNum(raw);
  epRecalc();
}
function epRecalc(){
  EP.locais.forEach(loc=>{
    const t=document.getElementById(`ep-${loc.id}-total`); if(t) t.textContent = epRowQtd(loc)||'—';
    const pm=document.getElementById(`ep-${loc.id}-pm`); if(pm) pm.textContent = epNum(epRowPesoMedio(loc));
    const lo=document.getElementById(`ep-${loc.id}-lot`); if(lo) lo.textContent = epNum(epRowLotacao(loc),2);
  });
  EP.colunas.forEach(c=>{
    const q=document.getElementById(`ep-col-${c.id}-q`); if(q) q.textContent = epColQtd(c.id)||'—';
    const p=document.getElementById(`ep-col-${c.id}-p`); if(p) p.textContent = epNum(epColPesoMedio(c.id));
  });
  const gq=document.getElementById('ep-g-qtd'); if(gq) gq.textContent = epGrandQtd();
  const gp=document.getElementById('ep-g-pm'); if(gp) gp.textContent = epNum(epGrandPesoMedio());
  const gl=document.getElementById('ep-g-lot'); if(gl) gl.textContent = epNum(epGrandLotacao(),2);
  const mc=document.getElementById('ep-m-cabecas'); if(mc) mc.textContent = epGrandQtd();
  const mp=document.getElementById('ep-m-pm'); if(mp) mp.innerHTML = `${epNum(epGrandPesoMedio())}<small>kg</small>`;
  const ml=document.getElementById('ep-m-lot'); if(ml) ml.innerHTML = `${epNum(epGrandLotacao(),2)}<small>cab/ha</small>`;
}
function epToggleCollapse(){ EP_COLLAPSED=!EP_COLLAPSED; render(); }
function epSalvar(){
  EP.status='salvo';
  const q = EP_MODO==='pasto' ? epGrandQtd() : epCatGrandQtd();
  const pm = EP_MODO==='pasto' ? epGrandPesoMedio() : epCatGrandPesoMedio();
  const modoLabel = EP_MODO==='pasto' ? 'Mapa de pasto' : 'Distribuição por categoria';
  toast({title:'Mapa de estoque salvo', msg:`${modoLabel} · ${EP.retiro} · ${q} cab. · peso médio ${epNum(pm)} kg. Definido como estoque de partida.`});
}

function lrFieldsBy(place){ return LR_REGISTRY.filter(f=>LR_PLACE[f.id]===place); }

/* próximo Apelido/ID com base no último adicionado (preserva prefixo/sufixo e zeros) */
function proximoApelido(prev){
  if(!prev) return '';
  const m = String(prev).match(/^(.*?)(\d+)(\D*)$/);
  if(!m) return prev;
  const [,pre,num,suf] = m;
  const inc = (parseInt(num,10)+1).toString().padStart(num.length,'0');
  return pre+inc+suf;
}

function lrDefaultVal(f){
  if(f.id==='data') return NASC_SHARED.data || hojeISO();
  if(f.id==='raca') return NASC_SHARED.raca || 'Nelore';
  if(f.id==='porte') return 'M';
  if(f.id==='colostro') return 'Sim';
  if(f.id==='pesagem') return 'Manual';
  return '';
}
function lrControl(f){
  const v = lrDefaultVal(f);
  switch(f.type){
    case 'date': return `<input id="${f.el}" type="date" value="${v}">`;
    case 'text': return `<input id="${f.el}" placeholder="${f.ph||''}">`;
    case 'textarea': return `<textarea id="${f.el}" rows="2" placeholder="${f.ph||''}"></textarea>`;
    case 'weight': return `<div class="weight-box" style="min-width:auto;padding:6px 8px"><input id="${f.el}" type="text" inputmode="decimal" placeholder="0,0" style="font-size:13px"><span class="unit" style="font-size:11px">Kg</span></div>`;
    case 'sexo': return `<select id="${f.el}"><option value="Macho">♂ M</option><option value="Fêmea">♀ F</option></select>`;
    case 'cat': return `<select id="${f.el}">${DB.categorias.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}</select>`;
    case 'lote': return `<select id="${f.el}"><option value="">—</option>${DB.lotes.map(l=>`<option value="${l.id}" ${l.id===(NASC_SHARED.lote||'')?'selected':''}>${l.codigo} · ${l.nome}</option>`).join('')}</select>`;
    case 'pai': return `<select id="${f.el}"><option value="">Selecione Pai</option>${DB.animais.filter(a=>a.sexo==='Macho').map(a=>`<option value="${a.id}">${a.brinco||a.id}</option>`).join('')}</select>`;
    case 'mae': return `<select id="${f.el}"><option value="">Selecione Mãe</option>${DB.animais.filter(a=>a.sexo==='Fêmea').map(a=>`<option value="${a.id}">${a.brinco||a.id}</option>`).join('')}</select>`;
    case 'select': {
      const opts = typeof f.opts==='function'?f.opts():f.opts;
      const ph = f.placeholder?`<option value="">${f.placeholder}</option>`:'';
      return `<select id="${f.el}">${ph}${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    }
  }
  return '';
}
function renderLrField(f, inGrid){
  const lbl = `<label>${f.label}${f.req?' <span class="req">*</span>':''}</label>`;
  if(inGrid){
    const cls = f.type==='textarea' ? 'field full3' : (f.type==='text'&&f.id==='nome' ? 'field full2' : 'field');
    return `<div class="${cls}">${lbl}${lrControl(f)}</div>`;
  }
  return `<div class="field" style="flex:${f.w||'1 1 110px'};min-width:0">${lbl}${lrControl(f)}</div>`;
}

  const fields = lrFieldsBy('dados');
  if(!fields.length) return `<div class="da-body"><div class="small" style="color:var(--muted)">Todos os campos foram movidos para o lançamento rápido.</div></div>`;
  return `<div class="da-body"><div class="da-grid">${fields.map(f=>renderLrField(f,true)).join('')}</div></div>`;
}

/* ===== Modal de configuração de campos (lápis) — modelo em tabela ===== */
const LR_TYPEBADGE = {date:'DATE', select:'SELECT', text:'TEXT', weight:'KG', sexo:'SELECT', cat:'SELECT', lote:'TEXT', pai:'SELECT', mae:'SELECT', textarea:'TEXT', sanitario:'AÇÃO'};
function camposConfigTable(){
  const curPlace = f => f.id==='sanitario' ? (LR_PLACE.sanitario||'top') : LR_PLACE[f.id];
  const pill = (f, val, label, cls, allowed) => {
    if(!allowed) return `<td></td>`;
    const on = curPlace(f)===val;
    return `<td><button class="cfg-pill ${cls} ${on?'on':''}" onclick="setCampoPlace('${f.id}','${val}')">${label}</button></td>`;
  };
  const rows = LR_REGISTRY.map(f=>{
    // Apelido/ID travado na Tabela; Sanitário só Superior ou Desativado
    const isApelido = f.locked;
    const isSan = f.enableOnly;
    const allowTop    = isApelido ? false : true;
    const allowBottom = isSan ? false : true;
    const allowDados  = (isApelido||isSan) ? false : true;
    const allowOff    = true;
    const autonumChip = isApelido ? `<label class="cfg-autonum-chip" title="Numeração automática: ao Adicionar sugere o próximo número (001 → 002)"><input type="checkbox" id="cfg-autonum" ${LR_AUTONUM?'checked':''} onchange="LR_AUTONUM=this.checked">Nº auto</label>` : '';
    return `<tr>
      <td class="cfg-fname">${f.label}${f.req?' <span class="req">*</span>':''}${autonumChip}</td>
      ${pill(f,'top','Superior','superior',allowTop)}
      ${pill(f,'bottom','Tabela','tabela',allowBottom)}
      ${pill(f,'dados','Adicionais','adicionais',allowDados)}
      ${pill(f,'off','Desativar','off',allowOff)}
    </tr>`;
  }).join('');
  return `<table class="cfg-table">
    <thead><tr>
      <th>Nome do campo do sistema</th>
      <th class="c-sup">Linha Superior</th>
      <th class="c-tab">Linha Tabela Lançamento</th>
      <th class="c-add">Dados Adicionais</th>
      <th class="c-off">Desativado</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}
function openCamposConfig(){
  openModal({
    title:'Configurar campos do Lançamento Rápido',
    sub:'Defina onde cada campo aparece: Linha Superior (repete em todos), Linha Tabela Lançamento (por animal), Dados Adicionais (recolhido) ou Desativado (não aparece).',
    body:`<div id="cfg-table-wrap">${camposConfigTable()}</div>`,
    foot:`<button class="btn ghost" onclick="resetCamposConfig()">Restaurar padrão</button><div class="spacer"></div><button class="btn primary" data-close>${icon('check')} Concluir</button>`,
  });
}
function setCampoPlace(id, val){
  if(id==='sanitario'){ LR_PLACE.sanitario = (val==='top'||val==='off') ? val : 'top'; SAN_ENABLED = LR_PLACE.sanitario==='top'; }
  else if(id==='apelido'){ if(val==='off') LR_PLACE.apelido='off'; else LR_PLACE.apelido='bottom'; }
  else { LR_PLACE[id] = val; }
  // re-render tabela do modal e o formulário
  const w=document.getElementById('cfg-table-wrap'); if(w) w.innerHTML=camposConfigTable();
  const el=document.getElementById('nasc-dist'); if(el) el.innerHTML=renderNascDist();
  updNascResumo(); updSalvarState();
}
function resetCamposConfig(){
  LR_REGISTRY.forEach(f=>LR_PLACE[f.id]=f.def);
  LR_AUTONUM=false; SAN_ENABLED=true;
  const w=document.getElementById('cfg-table-wrap'); if(w) w.innerHTML=camposConfigTable();
  const el=document.getElementById('nasc-dist'); if(el) el.innerHTML=renderNascDist();
  updNascResumo(); updSalvarState();
}


/* bloco de distribuição (quantidade + toggle + categoria/grid ou detalhamento inline) */

function toggleFromId(){

function addNascDetalhe(){
  const total = +(document.getElementById('mv-qtd-total')?.value)||0;
  const apelido = (document.getElementById('di-apelido')?.value||'').trim();
  const rfid = (document.getElementById('di-rfid')?.value||'').trim();
  const sisbov = (document.getElementById('di-sisbov')?.value||'').trim();
  const catId = document.getElementById('di-cat')?.value||'';
  const sexo = document.getElementById('di-sexo')?.value||'Macho';
  const tam = document.getElementById('di-tam')?.value||'M';
  const colostro = document.getElementById('di-col')?.value||'Sim';
  const pesagem = document.getElementById('di-pes')?.value||'Manual';
  const raca = document.getElementById('di-rraca')?.value||'Nelore';
  const data = document.getElementById('di-data')?.value||hojeISO();
  const lote = document.getElementById('di-lote')?.value||'';
  const peso = parseFloat((document.getElementById('di-peso')?.value||'').replace(',','.'))||0;
  if(total<1){ toast({title:'Informe a quantidade primeiro',kind:'crit'}); return; }
  if(!apelido){ toast({title:'Informe o Apelido/ID',kind:'crit'}); return; }
  if(NASC_DETALHE.length>=total){ toast({title:'Limite atingido',msg:`Você já identificou ${total} de ${total}. Remova um item ou aumente a quantidade.`,kind:'warn'}); return; }
  // parâmetros que se repetem
  NASC_SHARED = { data, raca, lote };
  const gv = id => document.getElementById(id)?.value || '';
  const dados = {
    nome:gv('da-nome'), grau:gv('da-grau'), rgn:gv('da-rgn'), pelagem:gv('da-pelagem'),
    chifre:gv('da-chifre'), rgd:gv('da-rgd'), serie:gv('da-serie'), pai:gv('da-pai'),
    mae:gv('da-mae'), obs:gv('da-obs'), pesoNascer:gv('da-peso'),
  };
  NASC_DETALHE.push({apelido, rfid:rfid||null, sisbov:sisbov||null, catId, sexo, tam, colostro, pesagem, raca, peso, data, lote, dados});
  const nextAp = LR_AUTONUM ? proximoApelido(apelido) : '';
  document.getElementById('nasc-dist').innerHTML = renderNascDist();
  if(LR_AUTONUM && nextAp){ const ae=document.getElementById('di-apelido'); if(ae){ ae.value=nextAp; ae.focus(); } }
  updNascResumo(); updSalvarState();
}
function removeNascDetalhe(i){
  NASC_DETALHE.splice(i,1);
  document.getElementById('nasc-dist').innerHTML = renderNascDist();
  updNascResumo(); updSalvarState();
}

function novoNascimento(){ NASC_CATS=[]; NASC_DETALHE=[]; NASC_FROMID=false; render(); }

function updSalvarState(){
  const btn = document.getElementById('mv-salvar'); if(!btn) return;
  const blk = document.getElementById('mv-block');
  const total = +(document.getElementById('mv-qtd-total')?.value)||0;
  if(NASC_FROMID){
    const done = NASC_DETALHE.length;
    const ok = total>0 && done===total;
    btn.disabled = !ok;
    btn.style.opacity = ok?'1':'.5';
    btn.style.cursor = ok?'pointer':'not-allowed';
    if(blk) blk.innerHTML = ok
      ? `<span style="color:var(--ok)">${icon('check')} ${done} de ${total} identificados</span>`
      : `<span>Identifique ${total||'os'} animais para salvar (${done}/${total||0})</span>`;
  } else {
    btn.disabled = false; btn.style.opacity='1'; btn.style.cursor='pointer';
    if(blk) blk.innerHTML='';
  }
}

/* ===== Sanitário (dentro da Atribuição de ID) ===== */
let SAN_OPEN = false;
let SAN_APLIC = 'unica';       // 'unica' | 'protocolo'
let SAN_ITEMS = [];            // {medId, nome, tipoDose, dose, porKg, unidade, custo}

function toggleSanitario(){ SAN_OPEN=!SAN_OPEN; refreshSanitario(); }
function setSanAplic(v){ SAN_APLIC=v; refreshSanitario(); }
function refreshSanitario(){
  // contexto inline (modo "vem do ID" no formulário de lançamento)
  if(NASC_FROMID && document.getElementById('nasc-dist') && document.getElementById('di-cat')){
    rerenderInline(); return;
  }
  const el=document.getElementById('san-block'); if(el) el.outerHTML=sanitarioSection();
}
function rerenderInline(){
  const keep={};
  ['mv-qtd-total','di-apelido','di-rfid','di-sisbov','di-peso','di-data',
   'da-nome','da-peso','da-rgn','da-rgd','da-serie','da-obs','da-grau','da-pelagem','da-chifre','da-pai','da-mae'].forEach(id=>{const e=document.getElementById(id); if(e) keep[id]=e.value;});
  const catv=document.getElementById('di-cat')?.value, rracav=document.getElementById('di-rraca')?.value, lotev=document.getElementById('di-lote')?.value;
  document.getElementById('nasc-dist').innerHTML = renderNascDist();
  Object.keys(keep).forEach(id=>{const e=document.getElementById(id); if(e) e.value=keep[id];});
  const cat=document.getElementById('di-cat'); if(cat&&catv) cat.value=catv;
  const rr=document.getElementById('di-rraca'); if(rr&&rracav) rr.value=rracav;
  const lo=document.getElementById('di-lote'); if(lo&&lotev) lo.value=lotev;
  updNascResumo(); updSalvarState();
}

function sanitarioBodyInner(){
  const medOpts = `<option value="">Selecione um item</option>`+DB.medicamentos.map(m=>`<option value="${m.id}">${m.nome}</option>`).join('');
  const prOpts = `<option value="">Selecione um item</option>`+DB.protocolos.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');
  const totalCusto = SAN_ITEMS.reduce((a,i)=>a+i.custo,0);
  return `
      <div class="field" style="max-width:380px"><label>Tipo de Aplicação</label>
        <div class="radio-row">
          <label class="radio-opt"><input type="radio" name="san-aplic" value="unica" ${SAN_APLIC==='unica'?'checked':''} onchange="setSanAplic('unica')">Aplicação Única</label>
          <label class="radio-opt"><input type="radio" name="san-aplic" value="protocolo" ${SAN_APLIC==='protocolo'?'checked':''} onchange="setSanAplic('protocolo')">Protocolo</label>
        </div>
      </div>
      <div class="field" style="max-width:520px"><label>Protocolo Sanitário</label>
        <select id="san-prot" ${SAN_APLIC==='unica'?'disabled':''}>${prOpts}</select>
      </div>
      <div class="atrib-foot" style="align-items:flex-end">
        <div class="field" style="min-width:230px;flex:1"><label>Vacina/Medicamento</label><select id="san-med" onchange="sanMedChange()">${medOpts}</select></div>
        <div class="field" style="max-width:130px"><label>Unidade de Medida</label><input id="san-un" disabled placeholder="—"></div>
        <div class="field" style="max-width:130px"><label>Tipo de Dose</label><select id="san-tipo"><option value="">Selecione</option><option>Fixa</option><option>Por Peso</option></select></div>
        <div class="field" style="max-width:110px"><label>Dose <span class="req">*</span></label><input id="san-dose" type="text" inputmode="decimal" placeholder="0,00"></div>
        <div class="field" style="max-width:140px"><label>Por Cada (X) Kg</label><div class="weight-box" style="min-width:auto;padding:8px 12px"><input id="san-porkg" type="text" inputmode="decimal" placeholder="0,00" style="font-size:18px"><span class="unit" style="font-size:15px">Kg</span></div></div>
        <button class="btn primary add-big" onclick="addSanItem()">${icon('plus')} Adicionar</button>
      </div>
      <table class="tbl" style="margin-top:6px">
        <thead><tr><th>Vacina/Medicamento</th><th>Tipo de Dose</th><th>Qtde/Por Cada (X) Kg</th><th>Dose</th><th>Unidade de Medida</th><th>Custo da Aplicação</th><th>Ações</th></tr></thead>
        <tbody>${SAN_ITEMS.length?SAN_ITEMS.map((it,i)=>`<tr>
          <td class="strong">${it.nome}</td>
          <td>${it.tipoDose||'—'}</td>
          <td class="num">${it.porKg?it.porKg+' Kg':'—'}</td>
          <td class="num">${it.dose.toFixed(2).replace('.',',')}</td>
          <td>${it.unidade}</td>
          <td class="num">R$ ${it.custo.toFixed(2).replace('.',',')}</td>
          <td class="row-actions"><button class="icon-btn" title="Editar" onclick="editSanItem(${i})">${icon('edit')}</button><button class="icon-btn danger-ic" title="Remover" onclick="removeSanItem(${i})">${icon('trash')}</button></td>
        </tr>`).join(''):`<tr><td colspan="7" class="empty" style="padding:22px">${icon('reproducao')}<div>Nenhuma aplicação adicionada.</div></td></tr>`}</tbody>
        ${SAN_ITEMS.length?`<tfoot><tr><td colspan="5" class="strong">Custo total da aplicação</td><td class="num strong" style="color:var(--blue)">R$ ${totalCusto.toFixed(2).replace('.',',')}</td><td></td></tr></tfoot>`:''}
      </table>`;

function sanitarioSection(){
  const body = !SAN_OPEN ? '' : `<div class="san-body">${sanitarioBodyInner()}</div>`;
  return `<div id="san-block" class="san-section">
    <button class="san-toggle" onclick="toggleSanitario()">
      <span class="san-chev ${SAN_OPEN?'open':''}">${icon('chevDown')}</span>
      <span class="san-title">Sanitário</span>
      ${SAN_ITEMS.length?`<span class="tag blue" style="margin-left:8px">${SAN_ITEMS.length} aplicação(ões)</span>`:''}
    </button>
    ${body}
  </div>`;
}
function sanMedChange(){
  const id = document.getElementById('san-med').value;
  const m = DB.medicamentos.find(x=>x.id===id);
  document.getElementById('san-un').value = m?m.unidade:'';
}
function addSanItem(){
  const id = document.getElementById('san-med').value;
  const m = DB.medicamentos.find(x=>x.id===id);
  if(!m){ toast({title:'Selecione a vacina/medicamento',kind:'crit'}); return; }
  const dose = parseFloat((document.getElementById('san-dose').value||'').replace(',','.'))||0;
  if(dose<=0){ toast({title:'Informe a dose',kind:'crit'}); return; }
  const porKg = parseFloat((document.getElementById('san-porkg').value||'').replace(',','.'))||0;
  const tipoDose = document.getElementById('san-tipo').value;
  SAN_ITEMS.push({ medId:m.id, nome:m.nome, unidade:m.unidade, tipoDose, dose, porKg, custo:+(m.custoUnit*dose).toFixed(2) });
  refreshSanitario();
  toast({title:'Aplicação adicionada',msg:`${m.nome} · dose ${dose}`});
}
function editSanItem(i){
  const it=SAN_ITEMS[i]; if(!it) return;
  SAN_ITEMS.splice(i,1); refreshSanitario();
  document.getElementById('san-med').value=it.medId; sanMedChange();
  document.getElementById('san-dose').value=String(it.dose).replace('.',',');
  if(it.porKg) document.getElementById('san-porkg').value=String(it.porKg).replace('.',',');
  if(it.tipoDose) document.getElementById('san-tipo').value=it.tipoDose;
}
function removeSanItem(i){ SAN_ITEMS.splice(i,1); refreshSanitario(); }

function renderNascCats(){
  // modo "vem do ID": grid derivado do detalhamento individual (somente leitura)
  if(NASC_FROMID){
    if(!NASC_DETALHE.length) return '';
    const tally = {};
    NASC_DETALHE.forEach(d=>{ tally[d.catId]=(tally[d.catId]||0)+1; });
    const total = Object.values(tally).reduce((a,n)=>a+n,0);
    return `<div class="panel" style="margin:6px 0 0;box-shadow:none">
      <table class="tbl">
        <thead><tr><th>Categoria</th><th style="width:160px">Quantidade (do ID)</th></tr></thead>

        <tfoot><tr><td class="strong">Total identificado</td><td class="num strong" style="color:var(--blue)">${total} cab.</td></tr></tfoot>
      </table>
    </div>`;
  }
  if(!NASC_CATS.length){
    // Modelo A: tabela sempre presente, total no rodapé mostrando 0
    return `<div class="panel" style="margin:6px 0 0;box-shadow:none">
      <table class="tbl">
        <thead><tr><th>Categoria</th><th style="width:120px">Quantidade</th><th style="width:110px">Ações</th></tr></thead>
        <tbody><tr class="empty-cat-row"><td colspan="3">Nenhuma categoria adicionada — o total começa em 0.</td></tr></tbody>
        <tfoot><tr><td class="strong">Total</td><td class="num strong" style="color:var(--blue)">0 cab.</td><td></td></tr></tfoot>
      </table>
    </div>`;
  }
  const total = NASC_CATS.reduce((a,c)=>a+c.qtd,0);
  return `<div class="panel" style="margin:6px 0 0;box-shadow:none">
    <table class="tbl">
      <thead><tr><th>Categoria</th><th style="width:120px">Quantidade</th><th style="width:110px"></th></tr></thead>
      <tbody>
        ${NASC_CATS.map((c,i)=>`<tr>
          <td class="strong">${c.catNome}</td>
          <td class="num">${c.qtd} cab.</td>
          <td class="row-actions">
            <button class="icon-btn" title="Editar" onclick="editNascCat(${i})">${icon('edit')}</button>
            <button class="icon-btn" title="Remover" onclick="removeNascCat(${i})">${icon('trash')}</button>
          </td>
        </tr>`).join('')}
      </tbody>
      <tfoot><tr><td class="strong">Total</td><td class="num strong" style="color:var(--blue)">${total} cab.</td><td></td></tr></tfoot>
    </table>
  </div>`;
}
function refreshNascCats(){ const el=document.getElementById('nasc-cats'); if(el) el.innerHTML=renderNascCats(); updNascResumo(); }

function updNascResumo(){
  const el = document.getElementById('nasc-resumo'); if(!el) return;
  const total = +(document.getElementById('mv-qtd-total')?.value)||0;
  if(NASC_FROMID){
    const done = NASC_DETALHE.length;
    if(!total){ el.innerHTML = `<span class="nasc-tag muted">${icon('info')} Informe a quantidade</span>`; return; }
    el.innerHTML = done===total
      ? `<span class="nasc-tag ok">${icon('check')} ${done} de ${total} identificados</span>`
      : `<span class="nasc-tag muted">${done} de ${total} identificados</span>`;
    return;
  }
  const declared = NASC_CATS.reduce((a,c)=>a+c.qtd,0);
  if(!declared){ el.innerHTML=''; return; }
  el.innerHTML = `<span class="nasc-tag ok">${icon('check')} Total ${declared} cab. em ${NASC_CATS.length} categoria(s)</span>`;
}

function addNascCat(){
  const catId = document.getElementById('mv-cat')?.value || '';
  const catNome = document.getElementById('mv-catlk-name')?.value || '';
  const qtd = +(document.getElementById('mv-qtd-total')?.value) || 0;
  if(!catId){ toast({title:'Selecione a categoria',msg:'Use a lupa para escolher a categoria antes de adicionar.',kind:'crit'}); return; }
  if(qtd<1){ toast({title:'Informe a quantidade',msg:'Digite a quantidade desta categoria no campo Quantidade.',kind:'crit'}); return; }
  const existing = NASC_CATS.find(c=>c.catId===catId);
  if(existing){ existing.qtd += qtd; }
  else NASC_CATS.push({catId, catNome, qtd});
  // limpa para a próxima linha
  document.getElementById('mv-cat').value='';
  document.getElementById('mv-catlk-name').value='';
  const cod=document.getElementById('mv-catlk-cod'); if(cod) cod.value='';
  document.getElementById('mv-qtd-total').value='';
  refreshNascCats();
  toast({title:'Categoria adicionada',msg:`${catNome} · ${qtd} cab.`});
}

function computeMeses(dataISO){
  if(!dataISO) return 0;
  const d = new Date(dataISO), now = new Date();
  return Math.max(0, Math.round((now-d)/(86400000*30.44)));
}

function adicionarAtribuicao(){
  const m = DB.movimentos.find(x=>x.id===NASC_TARGET);
  if(!m){ toast({title:'Lançamento não encontrado',kind:'crit'}); return; }
  const apelido = val('at-apelido');
  const peso = parseFloat(val('at-peso').replace(',','.'))||0;
  const catId = document.getElementById('at-cat')?.value || null;
  if(!apelido){ toast({title:'Informe o Apelido/ID Usual',kind:'crit'}); return; }
  if(!catId){ toast({title:'Selecione a categoria',kind:'crit'}); return; }
  if(m.naoIdentificados<=0){ toast({title:'Lançamento já totalmente identificado',msg:'Todos os bezerros deste nascimento já têm ficha.',kind:'warn'}); return; }
  const tam = document.querySelector('input[name="at-tam"]:checked')?.value || 'M';
  const c = DB.categorias.find(c=>c.id===catId);
  // preserva os parâmetros compartilhados para os próximos lançamentos
  ATRIB_SHARED = { data: val('at-data')||m.data, raca: val('at-raca'), lote: document.getElementById('at-lote')?.value||'' };
  const newId = nextAnimalId();
  DB.animais.push({
    id:newId, brinco:apelido, statusBrinco:'ok',
    rfid:val('at-rfid')||null, sisbov:val('at-sisbov')||null,
    sexo: c&&c.sexo!=='Misto'?c.sexo:'Macho',
    raca:ATRIB_SHARED.raca, categoria:catId, vivo:true,
    pesoNasc:peso>0?peso:null, tamanho:tam,
  });
  if(peso>0) DB.pesagens.push({ id:'pe-'+Date.now(), animal:newId, data:ATRIB_SHARED.data, peso });
  m.vinculados.push(newId);
  m.naoIdentificados = Math.max(0, m.naoIdentificados-1);
  if(m.naoIdentificados<=0) m.status='conciliado';
  document.getElementById('nasc-bottom').innerHTML = atribuicaoPanel();
  toast({title:'Bezerro identificado',msg:`${newId} · ${apelido} · ${nomeCategoria(catId)} · ${peso} kg. ${m.naoIdentificados} ainda a detalhar.`, kind:m.naoIdentificados<=0?'ok':'warn'});
}

  const totGeral = recent.reduce((s,m)=>s+m.qtd,0);

  const resumo = recent.length
    ? `${hojeList.length} hoje · <b style="color:var(--ok)">+${totHoje} cab.</b> <span class="sub-cell">· ${recent.length} no total (+${totGeral})</span>`

  const tabela = NASC_HIST_OPEN ? `<div class="hist-body">

  const cob = qtd>0 ? (ident/qtd*100) : 100;
  let blockMsg = '';

  if(M.verbo==='saida' && qtd>saldo){
    blockMsg = `<div class="pill crit" style="margin-top:6px"><span class="d"></span>Baixa (${qtd}) maior que o saldo (${saldo}) — erro crítico, bloqueia.</div>`;

  } else { document.getElementById('mv-block').innerHTML = ''; }
  const cobC = classifCobertura(cob);
  const cobColor = cobC.cls==='ok'?'var(--ok)':cobC.cls==='alerta'?'var(--alerta)':'var(--crit)';
  document.getElementById('mv-preview').innerHTML = `
    <div class="kv"><span class="k">Saldo da categoria</span><span class="v">${saldo} cab.</span></div>
    <div class="kv"><span class="k">Após o lançamento</span><span class="v" style="color:${M.verbo==='entrada'?'var(--ok)':'var(--crit)'}">${novoSaldo} cab.</span></div>
    <div class="kv"><span class="k">Identificados agora</span><span class="v">${ident} de ${qtd}</span></div>
    <div class="kv"><span class="k">Irão à Mesa</span><span class="v" style="color:${ni>0?'var(--orange)':'var(--ok)'}">${ni} sem id.</span></div>
    <div style="margin-top:12px">${coberturaBadge(cob)}</div>
    ${blockMsg}`;

function salvarMovimento(tipo){
  const M = MOV_META[tipo];
  // Nascimento: quantidade é a âncora; no modo manual o total vem das categorias
  if(tipo==='nascimento'){
    const data=val('mv-data'), resp='Equipe Campo', safra=val('mv-safra');
    const faz=document.getElementById('mv-fazenda-name')?.value||'';
    const ret=document.getElementById('mv-retiro-name')?.value||'';
    const loc=document.getElementById('mv-local-name')?.value||'';
    const prop=document.getElementById('mv-prop-name')?.value||'';

    // Modo "distribuição vem do ID": só salva com todos identificados
    if(NASC_FROMID){
      const total = +val('mv-qtd-total')||0;
      if(total<1){ toast({title:'Informe a quantidade',msg:'A quantidade de nascidos é a base de verificação.',kind:'crit'}); return; }
      if(NASC_DETALHE.length!==total){
        toast({title:'Identificação incompleta',msg:`Salvar exige ${total} animais identificados; você tem ${NASC_DETALHE.length}. O total atribuído precisa bater com a quantidade.`,kind:'crit',timeout:6000});
        return;
      }
      const movId='mv-'+Date.now();
      const tally={};
      const vinculados=[];
      NASC_DETALHE.forEach(d=>{
        const nid=nextAnimalId();
        const c=DB.categorias.find(c=>c.id===d.catId);
        DB.animais.push({ id:nid, brinco:d.apelido, statusBrinco:'ok', rfid:d.rfid||null, sisbov:d.sisbov||null,
          sexo:d.sexo||(c&&c.sexo!=='Misto'?c.sexo:'Macho'), raca:d.raca||'A definir', categoria:d.catId, vivo:true, pesoNasc:d.peso>0?d.peso:null, tamanho:d.tam, colostro:d.colostro });
        if(d.peso>0) DB.pesagens.push({ id:'pe-'+nid, animal:nid, data, peso:d.peso });
        vinculados.push(nid);
        tally[d.catId]=(tally[d.catId]||0)+1;
      });
      const catDecl=Object.keys(tally).map(cid=>({catId:cid, qtd:tally[cid]}));
      DB.movimentos.push({ id:movId, tipo:'nascimento', data, responsavel:resp, qtd:total, categoria:null,
        catDecl, vinculados, naoIdentificados:0, status:'conciliado', sanitario:SAN_ITEMS.slice(), safra, fazenda:faz, retiro:ret, local:loc, proprietario:prop });
      NASC_DETALHE=[]; NASC_FROMID=false; SAN_ITEMS=[];
      render();
      toast({title:'Nascimento salvo e conciliado', msg:`${total} cab. identificadas. Distribuição por categoria veio do ID — total atribuído bate com a quantidade.`});
      return;
    }

    // Modo manual: total = soma das categorias declaradas (a distribuição é normal)
    if(!NASC_CATS.length){
      const cid=val('mv-cat'); const cq=+val('mv-qtd-total')||0;
      if(cid && cq>0) NASC_CATS.push({catId:cid, catNome:document.getElementById('mv-catlk-name')?.value||'', qtd:cq});
    }
    const total = NASC_CATS.reduce((a,c)=>a+c.qtd,0);
    if(total<1){ toast({title:'Informe ao menos uma categoria',msg:'Selecione a categoria, digite a quantidade e use + mais.',kind:'crit'}); return; }
    const k = NASC_CATS.length;
    DB.movimentos.push({ id:'mv-'+Date.now(), tipo:'nascimento', data, responsavel:resp,
      qtd:total, categoria:null, catDecl:NASC_CATS.map(c=>({catId:c.catId, qtd:c.qtd})),
      vinculados:[], naoIdentificados:total, status:'pendente',
      safra, fazenda:faz, retiro:ret, local:loc, proprietario:prop });
    NASC_CATS = [];
    render();
    toast({title:'Nascimento salvo no estoque', msg:`${total} cab. em ${k} categoria(s) somadas ao saldo. Identificação pendente na Mesa (Atribuir ID).`, kind:'warn', timeout:7000});
    return;
  }
  const cat=val('mv-cat'), qtd=+val('mv-qtd')||0, lote=val('mv-lote'), data=val('mv-data'), resp=val('mv-resp');
  const brincoBezerro = M.identMode==='brinco' ? val('mv-brinco') : '';
  const ident = M.identMode==='brinco' ? (brincoBezerro?Math.min(1,qtd):0) : Math.min(+val('mv-ident')||0,qtd);
  const extra = document.getElementById('mv-extra')?.value || '';
  const saldo = saldoCategoria(cat);
  if(!cat){ toast({title:'Selecione a categoria',msg:'Use o código ou a lupa para escolher a categoria.',kind:'crit'}); return; }
  if(qtd<1){ toast({title:'Quantidade inválida',kind:'crit'}); return; }
  if(M.verbo==='saida' && qtd>saldo){
    toast({title:'Bloqueado — erro crítico',msg:`A baixa de ${qtd} excede o saldo de ${saldo} cab. da categoria. Único caso em que o sistema trava.`,kind:'crit',timeout:7000});
    return;
  }
  const ni = Math.max(0, qtd-ident);
  const mov = { id:'mv-'+Date.now(), tipo, data, responsavel:resp, qtd, categoria:cat, vinculados:[], naoIdentificados:ni, status: ni>0?'pendente':'conciliado' };
  mov[M.dirField] = lote;
  if(M.extra==='origem') mov.origem=extra; if(M.extra==='destino') mov.destino=extra; if(M.extra==='causa') mov.causa=extra;
  // campos do formulário de Nascimento (padrão legado), se presentes
  if(document.getElementById('mv-ctrl')) mov.controle = val('mv-ctrl');
  if(document.getElementById('mv-safra')) mov.safra = val('mv-safra');
  if(document.getElementById('mv-fazenda-name')) mov.fazenda = document.getElementById('mv-fazenda-name').value;
  if(document.getElementById('mv-retiro-name')) mov.retiro = document.getElementById('mv-retiro-name').value;
  if(document.getElementById('mv-prop-name')) mov.proprietario = document.getElementById('mv-prop-name').value;
  if(M.identMode==='brinco' && brincoBezerro){
    // cria a ficha individual do bezerro já vinculada ao nascimento
    const c = DB.categorias.find(x=>x.id===cat);
    const newId = nextAnimalId();
    DB.animais.push({ id:newId, brinco:brincoBezerro, statusBrinco:'ok', sexo:c&&c.sexo!=='Misto'?c.sexo:'Macho', raca:'A definir', categoria:cat, vivo:true });
    mov.vinculados = [newId];
  } else {
    // vincula IDs existentes identificados da categoria
    mov.vinculados = DB.animais.filter(a=>a.categoria===cat && a.statusBrinco==='ok').slice(0,ident).map(a=>a.id);
  }
  DB.movimentos.push(mov);
  render();
  const cob = coberturaGlobal();
  if(ni>0){
    toast({title:`${M.titulo} salva no estoque`, msg:`Conciliação individual ${cob.toFixed(0)}%. ${ni} animal(is) sem identificação enviados à Mesa.`, kind:'warn', timeout:7000});
  } else {
    const extraMsg = M.identMode==='brinco'&&brincoBezerro?` Ficha ${mov.vinculados[0]} criada e vinculada.`:'';
    toast({title:`${M.titulo} salva no estoque`, msg:`Movimento conciliado — ${qtd} cab. ${M.verbo==='entrada'?'somadas ao':'baixadas do'} saldo.${extraMsg}`});
  }
}

function resolverMesa(id){
  const m = DB.movimentos.find(x=>x.id===id);
  openModal({
    title:'Resolver divergência',
    sub:`${MOV_META[m.tipo]?.titulo||tipoLabel(m.tipo)} · ${m.tipo==='nascimento'?(m.catDecl&&m.catDecl.length?m.catDecl.map(d=>nomeCategoria(d.catId)).join(', '):'a detalhar'):nomeCategoria(m.categoria)} · ${fmtData(m.data)}`,
    body:`<p class="small" style="margin-top:0">${m.naoIdentificados} animal(is) ficaram sem identificação. Vincule os brincos ou registre como baixa não identificada auditada. O estoque não muda.</p>
      <div class="form-grid" style="margin-top:6px">
        <div class="field"><label>Brincos vinculados agora</label><input id="rs-vinc" type="number" min="0" max="${m.naoIdentificados}" value="${m.naoIdentificados}"></div>
        <div class="field"><label>Responsável pela conciliação</label><input id="rs-resp" value="Antonio Chaker"></div>
        <div class="field full"><label>Observação de auditoria <span class="opt">(opcional)</span></label><textarea id="rs-obs" rows="2" placeholder="Ex.: brincos relidos no embarque."></textarea></div>
      </div>`,
    foot:`<div class="spacer"></div><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" onclick="confirmResolver('${id}')">${icon('checkCircle')} Conciliar</button>`,
  });
}
function confirmResolver(id){
  const m=DB.movimentos.find(x=>x.id===id);
  const vinc=Math.min(+val('rs-vinc')||0, m.naoIdentificados);
  const defCat = (m.catDecl&&m.catDecl[0]?m.catDecl[0].catId:m.categoria)||null;
  const novos = [];
  for(let i=0;i<vinc;i++){
    const nid = nextAnimalId();
    const c = DB.categorias.find(c=>c.id===defCat);
    DB.animais.push({ id:nid, brinco:null, statusBrinco:'sem', sexo:c&&c.sexo!=='Misto'?c.sexo:'Macho', raca:'A definir', categoria:defCat, vivo:true });
    novos.push(nid);
  }
  m.vinculados.push(...novos);
  m.naoIdentificados = Math.max(0, m.naoIdentificados - vinc);
  if(m.naoIdentificados<=0){ m.status='conciliado'; m.conciliadoPor=val('rs-resp'); }
  closeModal();render();
  toast({title:m.naoIdentificados<=0?'Divergência conciliada':'Pendência reduzida',msg:m.naoIdentificados<=0?`Cartão fechado por ${val('rs-resp')}. Auditoria registrada.`:`${m.naoIdentificados} ainda na Mesa.`,kind:m.naoIdentificados<=0?'ok':'warn'});
}

function ltLote(id){ return LT.lotes.find(l=>l.id===id); }
function ltLast(arr, loteId, pred){ return arr.filter(e=>e.lote===loteId && (!pred||pred(e))).sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0]; }
function ltLocalAtual(id){ const t=ltLast(LT.transferencias,id); return t?t.para:'—'; }
function ltPlanoNutri(id){ const m=ltLast(LT.manejos,id,e=>e.dim==='nutricional'); return m?m.plano:'—'; }
function ltProtocolo(id){ const m=ltLast(LT.manejos,id,e=>e.dim==='reprodutivo'); return m?m.plano:null; }
function ltFaseRepro(id){ const r=ltLast(LT.repro,id); return r?r.fase:'Sem evento reprodutivo'; }
function ltReproResumo(id){ const r=ltLast(LT.repro,id); return r?`<span class="sub-cell">${r.detalhe} · ${fmtData(r.data)}</span>`:'<span class="sub-cell">Registre a estação de monta para começar</span>'; }
function ltSaldo(id){ return LT.alocacoes.filter(a=>a.lote===id).reduce((s,a)=>s+a.qtd,0) - LT.alocacoes.filter(a=>a.de===id&&a.lote!==id).reduce((s,a)=>s+a.qtd,0); }
function ltComposicao(id){
  const map={};
  LT.alocacoes.filter(a=>a.lote===id && a.qtd>0).forEach(a=>{ map[a.categoria]=(map[a.categoria]||0)+a.qtd; });
  LT.alocacoes.filter(a=>a.de===id && a.lote!==id).forEach(a=>{ map[a.categoria]=(map[a.categoria]||0)-a.qtd; });
  return Object.entries(map).filter(([,q])=>q>0);
}
function ltPendencias(id){ return LT.alocacoes.filter(a=>a.lote===id).reduce((s,a)=>s+(a.naoIdent||0),0); }
function ltTimeline(id){
  const ev=[];
  LT.transferencias.filter(t=>t.lote===id).forEach(t=>ev.push({data:t.data,tipo:'transf',icon:'transferir',cls:'azul',titulo:`Transferência de lote → ${t.para}`,meta:`${t.de} → ${t.para} · ${t.tipoLocal}`,resp:t.resp}));
  LT.manejos.filter(m=>m.lote===id).forEach(m=>ev.push({data:m.data,tipo:'manejo',icon:m.dim==='reprodutivo'?'reproducao':'regime',cls:m.dim==='reprodutivo'?'roxo':'verde',titulo:m.dim==='reprodutivo'?'Evento reprodutivo':'Mudança de regime',meta:m.plano,resp:m.resp}));
  LT.alocacoes.filter(a=>a.lote===id && a.qtd>0 && a.data).forEach(a=>ev.push({data:a.data,tipo:'aloc',icon:'gestaoLotes',cls:'laranja',titulo:`Alocação — +${a.qtd} ${a.categoria}`,meta:a.de?`de outro lote`:'entrada no lote'+(a.naoIdent?` · ${a.naoIdent} sem id.`:''),resp:a.resp}));
  LT.alocacoes.filter(a=>a.de===id && a.lote!==id && a.qtd>0).forEach(a=>ev.push({data:a.data,tipo:'aloc',icon:'gestaoLotes',cls:'laranja',titulo:`Alocação — −${a.qtd} ${a.categoria}`,meta:`saída para ${ltLote(a.lote)?.codigo||'outro lote'}`,resp:a.resp}));
  LT.repro.filter(r=>r.lote===id).forEach(r=>ev.push({data:r.data,tipo:'repro',icon:'reproducao',cls:'verde',titulo:`Reprodução — ${r.fase}`,meta:r.detalhe,resp:r.resp}));
  return ev.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
const FIN_CLS = { Cria:'', Recria:'', Terminação:'', 'Outra Finalidade':'' };

function ltAnimaisVinculados(id){
  const ins=[]; const outs=new Set();
  LT.alocacoes.filter(a=>a.lote===id && a.animais).forEach(a=>a.animais.forEach(x=>ins.push(x)));
  LT.alocacoes.filter(a=>a.de===id && a.lote!==id && a.animais).forEach(a=>a.animais.forEach(x=>outs.add(x)));
  return [...new Set(ins)].filter(x=>!outs.has(x));
}
/* lote atual de um animal (por ID) — null = ainda sem lote */
function ltLoteDoAnimal(aid){
  for(const l of LT.lotes){ if(ltAnimaisVinculados(l.id).includes(aid)) return l; }
  return null;
}

function ltAnimalPickerRows(q){
  const term = (q||'').toLowerCase();
  const soSemLote = document.getElementById('lt-an-semlote')?.checked;
  const animais = DB.animais.filter(a=>a.vivo).filter(a=>{
    if(!term) return true;
    return a.id.toLowerCase().includes(term) || (a.brinco||'').toLowerCase().includes(term) || (a.raca||'').toLowerCase().includes(term);
  }).filter(a=> soSemLote ? !ltLoteDoAnimal(a.id) : true);
  if(!animais.length) return `<div class="empty" style="padding:18px">Nenhum animal encontrado.</div>`;
  return animais.map(a=>{
    const sel = LT_REMANEJO_SEL && LT_REMANEJO_SEL.has(a.id);
    const brinco = a.brinco?`<span class="mono">${a.brinco}</span>`:'<span class="pill pend" style="padding:1px 7px"><span class="d"></span>sem id.</span>';
    const loteAtual = ltLoteDoAnimal(a.id);
    const loteTag = loteAtual
      ? `<span class="tag">${loteAtual.codigo}</span>`
      : `<span class="pill neutral" style="padding:1px 7px"><span class="d"></span>sem lote</span>`;
    return `<label class="lt-an-row ${sel?'on':''}">

      <span class="lt-an-meta">${a.sexo} · ${a.raca} · ${nomeCategoria(a.categoria)}</span>

  }).join('');
}

function ltToggleAnimal(aid){
  if(LT_REMANEJO_SEL.has(aid)) LT_REMANEJO_SEL.delete(aid); else LT_REMANEJO_SEL.add(aid);
  const sel=document.getElementById('lt-an-sel');

    ? `<div class="lt-an-sel-head">${ids.length} animal(is) selecionado(s)</div>` + ids.map(i=>`<span class="tag">${i}</span>`).join('')

function ltSalvarRemanejo(id){
  const sent=val('lt-sent'), outro=val('lt-outro');
  if(sent==='out' && outro==='__none'){ toast({title:'Escolha o lote de destino',msg:'“Sem lote” só vale como origem de entrada.',kind:'crit'}); return; }
  if(LT_MODO_REMANEJO==='id'){
    const ids=[...LT_REMANEJO_SEL];
    if(!ids.length){ toast({title:'Selecione ao menos um animal',kind:'crit'}); return; }
    // agrupa por categoria real dos animais escolhidos
    const porCat={};
    ids.forEach(aid=>{ const a=DB.animais.find(x=>x.id===aid); const c=a?nomeCategoria(a.categoria):'—'; (porCat[c]=porCat[c]||[]).push(aid); });
    Object.entries(porCat).forEach(([cat,arr])=>{
      const rec={id:'a'+Date.now()+Math.random().toString(36).slice(2,5),qtd:arr.length,categoria:cat,data:hojeISO(),resp:'Antonio Chaker',naoIdent:0,animais:arr};
      if(sent==='in'){ rec.lote=id; rec.de=outro; } else { rec.lote=outro; rec.de=id; }
      LT.alocacoes.push(rec);
    });
    closeModal(); render();
    toast({title:'Animais vinculados ao lote', msg:`${ids.length} animal(is) por ID movimentados — 0 pendências, vínculo individual completo.`});
    return;
  }
  const cat=val('lt-cat'), qtd=+val('lt-qtd')||0, ident=Math.min(+val('lt-ident')||0,qtd);
  if(qtd<1){ toast({title:'Quantidade inválida',kind:'crit'}); return; }
  const ni=Math.max(0,qtd-ident);
  if(sent==='in') LT.alocacoes.push({id:'a'+Date.now(),lote:id,de:outro,qtd,categoria:cat,data:hojeISO(),resp:'Antonio Chaker',naoIdent:ni});
  else LT.alocacoes.push({id:'a'+Date.now(),lote:outro,de:id,qtd,categoria:cat,data:hojeISO(),resp:'Antonio Chaker',naoIdent:ni});
  closeModal(); render();
  toast({title:'Alocação lançada', msg:ni>0?`Estoque movido. ${ni} sem identificação enviados à Mesa.`:`${qtd} ${cat} movimentados. Saldo derivado atualizado.`, kind:ni>0?'warn':'ok'});
}

function ltSalvarRegime(id){
  const dim=val('lt-dim'), plano=val('lt-plano'), data=val('lt-ini')||hojeISO();
  if(!plano){ toast({title:'Descreva o plano',kind:'crit'}); return; }
  LT.manejos.push({id:'m'+Date.now(),lote:id,dim,plano,data,resp:'Antonio Chaker'});
  closeModal(); render();
  toast({title:'Regime atualizado', msg:`${dim==='reprodutivo'?'Protocolo':'Plano nutricional'} em vigor: ${plano}. Anterior preservado no histórico.`});
}
function ltEditarNome(id){
  const l=ltLote(id);
  openModal({title:'Editar lote',sub:'Nome, código e observação são atributos — não mexem na identidade nem no histórico.',
    body:`<div class="form-grid">
      <div class="field"><label>Código</label><input id="lt-cod" value="${l.codigo}"></div>
      <div class="field"><label>Nome</label><input id="lt-nome" value="${l.nome}"></div>
      <div class="field"><label>Finalidade</label><select id="lt-fin">${['Cria','Recria','Terminação','Outra Finalidade'].map(f=>`<option ${l.finalidade===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div class="field full"><label>Observação <span class="opt">(opcional)</span></label><textarea id="lt-obs" rows="3" placeholder="Anotações sobre o lote…">${l.obs||''}</textarea></div>
    </div>`,
    foot:`<div class="spacer"></div><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" onclick="ltSalvarNome('${id}')">${icon('save')} Salvar</button>`});
}
function ltSalvarNome(id){ const l=ltLote(id); l.codigo=val('lt-cod')||l.codigo; l.nome=val('lt-nome')||l.nome; l.finalidade=val('lt-fin')||l.finalidade; l.obs=document.getElementById('lt-obs')?.value||''; closeModal(); render(); toast({title:'Lote atualizado',msg:'Identidade e histórico preservados.'}); }

function ltEventoRepro(id){
  const l=ltLote(id);
  openModal({
    title:'Registrar evento reprodutivo', sub:`Processo Reprodutivo · ${l.codigo} · ${l.nome}`,
    body:`<div class="lt-decide">${icon('info')} <span>Cada fase do ciclo de cria é um evento na linha do tempo — estação de monta, diagnóstico, parição, desmama. O estado atual do lote é sempre a última fase registrada.</span></div>
      <div class="form-grid">
        <div class="field"><label>Fase <span class="req">*</span></label><select id="lt-fase">${['Estação de monta','Diagnóstico de gestação','Parição','Desmama','Repasse com touro','Descarte de vazias'].map(f=>`<option>${f}</option>`).join('')}</select></div>
        <div class="field"><label>Data</label><input id="lt-rdata" type="date" value="${hojeISO()}"></div>
        <div class="field full"><label>Detalhe <span class="opt">(resultado, nº de animais, protocolo…)</span></label><input id="lt-rdet" placeholder="Ex.: 112 prenhes (80%) · 28 vazias"></div>
      </div>`,
    foot:`<div class="spacer"></div><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" onclick="ltSalvarRepro('${id}')">${icon('save')} Registrar evento</button>`,
  });
}
function ltSalvarRepro(id){
  const fase=val('lt-fase'), detalhe=val('lt-rdet'), data=val('lt-rdata')||hojeISO();
  LT.repro.push({id:'r'+Date.now(),lote:id,fase,detalhe:detalhe||'—',data,resp:'Antonio Chaker'});
  closeModal(); render();
  toast({title:'Evento reprodutivo registrado', msg:`${fase} em vigor. Fases anteriores preservadas no histórico do lote.`});
}
function ltEncerrar(id){
  const l=ltLote(id);
  openModal({title:'Encerrar lote',sub:`${l.codigo} · ${l.nome}`,
    body:`<p class="small" style="margin-top:0">Encerrar não deleta — o lote sai das listas operacionais e permanece na consulta histórica. Use quando o ciclo terminou (todos vendidos/abatidos) ou ao juntar lotes.</p>`,
    foot:`<div class="spacer"></div><button class="btn ghost" data-close>Cancelar</button><button class="btn danger" onclick="ltConfirmEncerrar('${id}')">${icon('encerrar')} Encerrar lote</button>`});
}
function ltConfirmEncerrar(id){ const l=ltLote(id); l.status='encerrado'; l.encerramento=hojeISO(); closeModal(); render(); toast({title:'Lote encerrado',msg:`${l.codigo} arquivado. Histórico segue consultável.`}); }
function ltNovoLote(){
  openModal({title:'Novo lote',sub:'A identidade do lote é a finalidade.',
    body:`<div class="form-grid">
      <div class="field"><label>Código</label><input id="nl-cod" placeholder="RC-05"></div>
      <div class="field"><label>Nome</label><input id="nl-nome" placeholder="Recria Fêmeas"></div>
      <div class="field"><label>Finalidade <span class="req">*</span></label><select id="nl-fin">${['Cria','Recria','Terminação','Outra Finalidade'].map(f=>`<option>${f}</option>`).join('')}</select></div>
      <div class="field full"><label>Observação <span class="opt">(opcional)</span></label><textarea id="nl-obs" rows="2" placeholder="Anotações sobre o lote…"></textarea></div>
    </div>`,
    foot:`<div class="spacer"></div><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" onclick="ltSalvarNovoLote()">${icon('save')} Criar lote</button>`});
}
function ltSalvarNovoLote(){
  const cod=val('nl-cod'),nome=val('nl-nome'),fin=val('nl-fin');
  if(!cod){ toast({title:'Informe o código',kind:'crit'}); return; }
  const id='L'+Date.now();
  LT.lotes.push({id,codigo:cod,nome:nome||cod,finalidade:fin,status:'ativo',abertura:hojeISO(),obs:val('nl-obs')});

  toast({title:'Lote criado',msg:`${cod} · finalidade ${fin}. Agora lance os eventos de composição, local e regime.`});
}

  </script>
  <script>
/* ===== RELATÓRIO POR MOVIMENTO ===== */
function viewRelMov(){
  const tipos = ['nascimento','compra','venda','morte','alocacao'];
  const rows = tipos.map(t=>{
    const ms = DB.movimentos.filter(m=>m.tipo===t);
    const total = ms.reduce((a,m)=>a+m.qtd,0);
    const pend = ms.filter(m=>m.status==='pendente').length;
    const concil = ms.filter(m=>m.status==='conciliado').length;
    const ni = ms.reduce((a,m)=>a+m.naoIdentificados,0);
    return `<tr>
      <td class="strong">${tipoLabel(t)}</td>
      <td class="num">${ms.length}</td>
      <td class="num">${total}</td>
      <td>${concil?`<span class="pill ok"><span class="d"></span>${concil} conciliado(s)</span>`:'<span class="sub-cell">—</span>'} ${pend?`<span class="pill pend"><span class="d"></span>${pend} pendente(s)</span>`:''}</td>
      <td class="num" style="color:${ni>0?'var(--orange)':'var(--ok)'}">${ni}</td>
    </tr>`;
  }).join('');
  const cob = coberturaGlobal();
  return pageHead({
    title:'Relatório por movimento',
    layer:'mesa',
    sub:'Um resumo por tipo de movimento, com o status de conciliação de cada um. A análise honra a dupla camada: estoque fechado, individual transparente.',
    actions:`<button class="btn" onclick="toast({title:'Exportação simulada',msg:'CSV gerado neste protótipo.'})">${icon('save')} Exportar</button>`,
  }) + `
  <div class="metrics">
    <div class="metric"><div class="m-label">${icon('layers')} Estoque total</div><div class="m-value">${brl(estoqueTotal())} <small>cab.</small></div></div>
    <div class="metric"><div class="m-label">${icon('relMov')} Movimentos lançados</div><div class="m-value">${DB.movimentos.length}</div></div>
    <div class="metric"><div class="m-label">${icon('ficha')} Cobertura individual</div><div class="m-value" style="color:${classifCobertura(cob).cls==='ok'?'var(--ok)':classifCobertura(cob).cls==='alerta'?'var(--alerta)':'var(--crit)'}">${cob.toFixed(1)}<small>%</small></div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Resumo por tipo de movimento</h3></div>
    <table class="tbl"><thead><tr><th>Movimento</th><th>Lançamentos</th><th>Cabeças</th><th>Conciliação</th><th>Sem identificação</th></tr></thead><tbody>${rows}</tbody></table>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Saldo por categoria (derivado)</h3></div>
    ${panelNote('Saldo = estoque de partida + entradas − saídas. Nunca é a contagem da tabela de animais.')}
    <table class="tbl"><thead><tr><th>Categoria</th><th>Partida</th><th>Entradas</th><th>Saídas</th><th>Saldo atual</th></tr></thead>
    <tbody>${DB.categorias.map(c=>{
      const e=DB.movimentos.filter(m=>ENTRADAS.includes(m.tipo)).reduce((a,m)=>a+entradaContribCat(m,c.id),0);
      const s=DB.movimentos.filter(m=>m.categoria===c.id&&SAIDAS.includes(m.tipo)).reduce((a,m)=>a+m.qtd,0);
      return `<tr><td class="strong">${c.nome}</td><td class="num">${c.estoquePartida}</td><td class="num" style="color:var(--ok)">+${e}</td><td class="num" style="color:var(--crit)">−${s}</td><td class="num"><span class="derived">${icon('layers')} ${saldoCategoria(c.id)}</span></td></tr>`;
    }).join('')}${semCategoriaTotal()>0?`<tr style="background:#fffdf7"><td class="strong" style="color:var(--pend)">Sem categoria <span class="sub-cell">(a detalhar)</span></td><td class="num">—</td><td class="num" style="color:var(--ok)">+${semCategoriaTotal()}</td><td class="num">—</td><td class="num"><span class="pill pend"><span class="d"></span>${semCategoriaTotal()}</span></td></tr>`:''}</tbody></table>
  </div>`;
}

/* ===== GANHO DE PESO ===== */
function viewRelPeso(){
  const animais = animaisComPesagem().map(id=>({id, g:gmdAnimal(id)})).filter(x=>x.g).sort((a,b)=>b.g.gmd-a.g.gmd);
  const media = animais.reduce((a,x)=>a+x.g.gmd,0)/(animais.length||1);
  const maxGmd = Math.max(...animais.map(x=>x.g.gmd),0.001);
  const rows = animais.map((x,i)=>{
    const a=DB.animais.find(z=>z.id===x.id);
    const desvio = x.g.gmd-media;
    return `<tr>
      <td class="num">${i+1}º</td>
      <td><span class="mono" style="color:var(--blue);font-weight:600">${x.id}</span> ${a&&a.brinco?`<span class="sub-cell mono">${a.brinco}</span>`:''}</td>
      <td>${a?nomeCategoria(a.categoria):'—'}</td>
      <td class="num">${x.g.pesoFim} kg</td>
      <td class="num"><span class="derived">${icon('trend')} ${x.g.gmd.toFixed(3)}</span></td>
      <td><div class="cob-bar" style="width:120px"><i style="width:${(x.g.gmd/maxGmd*100).toFixed(0)}%;background:${x.g.gmd>=media?'var(--ok)':'var(--alerta)'}"></i></div></td>
      <td class="num" style="color:${desvio>=0?'var(--ok)':'var(--crit)'}">${desvio>=0?'+':''}${desvio.toFixed(3)}</td>
    </tr>`;
  }).join('');
  return pageHead({
    title:'Ganho de peso',
    layer:'individual',
    sub:'GMD, ranking e desvio em relação à média do grupo. Tudo calculado a partir das pesagens — a camada individual rica em análise.',
  }) + `
  <div class="metrics">
    <div class="metric"><div class="m-label">${icon('trend')} GMD médio do grupo</div><div class="m-value" style="color:var(--ok)">${media.toFixed(3)} <small>kg/dia</small></div></div>
    <div class="metric"><div class="m-label">${icon('scale')} Animais com curva</div><div class="m-value">${animais.length}</div><div class="m-sub">com ≥ 2 pesagens</div></div>
    <div class="metric"><div class="m-label">${icon('relPeso')} Melhor desempenho</div><div class="m-value">${animais[0]?animais[0].g.gmd.toFixed(3):'—'}</div><div class="m-sub">${animais[0]?animais[0].id:''}</div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Ranking de GMD</h3></div>
    <table class="tbl"><thead><tr><th>#</th><th>Animal</th><th>Categoria</th><th>Peso atual</th><th>GMD</th><th>vs. melhor</th><th>Desvio da média</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

/* ===== REPRODUTIVO ===== */
function viewRelReprod(){
  const matrizes = repMatrizes();
  const rows = matrizes.map(id=>{
    const evs = DB.reproducao.filter(r=>r.matriz===id).sort((a,b)=>a.data.localeCompare(b.data));
    const a=DB.animais.find(x=>x.id===id);
    const diag = evs.find(e=>e.tipo==='Diagnóstico');
    const partos = evs.filter(e=>e.tipo==='Parto').length;
    const cobs = evs.filter(e=>e.tipo==='IATF'||e.tipo==='Cobertura').length;
    const st = diag ? (diag.resultado==='Prenhe'?'ok':'alerta') : 'neutral';
    const stLabel = diag ? diag.resultado : 'Sem diagnóstico';
    return `<tr>
      <td><span class="mono" style="color:var(--blue);font-weight:600">${id}</span> ${a&&a.brinco?`<span class="sub-cell mono">${a.brinco}</span>`:''}</td>
      <td class="num">${cobs}</td>
      <td><span class="pill ${st}"><span class="d"></span>${stLabel}</span></td>
      <td class="num">${partos}</td>
      <td class="sub-cell">${evs.map(e=>e.tipo).join(' → ')}</td>
    </tr>`;
  }).join('');
  const prenhez = taxaPrenhez();
  return pageHead({
    title:'Reprodutivo',
    layer:'individual',
    sub:'Taxa de prenhez, coberturas e partos por matriz. Visão de eficiência reprodutiva do rebanho.',
  }) + `
  <div class="metrics">
    <div class="metric"><div class="m-label">${icon('reproducao')} Taxa de prenhez</div><div class="m-value" style="color:${prenhez>=50?'var(--ok)':'var(--alerta)'}">${prenhez.toFixed(0)}<small>%</small></div></div>
    <div class="metric"><div class="m-label">${icon('user')} Matrizes</div><div class="m-value">${matrizes.length}</div></div>
    <div class="metric"><div class="m-label">${icon('relReprod')} Coberturas/IATF</div><div class="m-value">${DB.reproducao.filter(r=>r.tipo==='IATF'||r.tipo==='Cobertura').length}</div></div>
    <div class="metric"><div class="m-label">${icon('nascimento')} Partos</div><div class="m-value">${DB.reproducao.filter(r=>r.tipo==='Parto').length}</div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Por matriz</h3></div>
    <table class="tbl"><thead><tr><th>Matriz</th><th>Coberturas</th><th>Diagnóstico</th><th>Partos</th><th>Linha do tempo</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

  </script>
  <script>
/* ===== Navegação ===== */
const NAV = [
  { group:'CADASTROS', label:'CADASTROS', items:[
    { id:'categoria', title:'Categoria animal', icon:'categoria', layer:'estoque',    desc:'Sexo, faixa de idade e estoque de partida do rebanho.', view:viewCategoria },
    { id:'local',     title:'Local',           icon:'local',     layer:'estoque',    desc:'Pastos e retiros da fazenda.', view:viewLocal },
    { id:'lotes',     title:'Lotes',           icon:'lotes',     layer:'estoque',    desc:'Agrupamento por finalidade. Sem local nem lista de animais.', view:viewLotes },
    { id:'estoque-partida', title:'Estoque de partida', icon:'estoquePartida', layer:'estoque', desc:'Mapa inicial do rebanho por local e categoria, com peso e lotação.', view:viewEstoquePartida },
    { id:'ficha',     title:'Ficha Animal',icon:'ficha',     layer:'individual', desc:'ID interno como chave; brinco e RFID versionados.', view:viewFicha },
  ]},
  { group:'MOVIMENTAÇÃO', label:'MOVIMENTAÇÃO', items:[
    { id:'nascimento',title:'Nascimento',      icon:'nascimento',layer:'estoque',    desc:'Entrada — soma ao estoque da categoria.', view:()=>viewMovimento('nascimento') },
    { id:'compra',    title:'Compra',          icon:'compra',    layer:'estoque',    desc:'Entrada — animais comprados somam ao estoque.', view:()=>viewMovimento('compra') },
    { id:'venda',     title:'Venda',           icon:'venda',     layer:'estoque',    desc:'Saída — baixa o estoque; conclui sem brinco.', view:()=>viewMovimento('venda') },
    { id:'morte',     title:'Morte',           icon:'morte',     layer:'estoque',    desc:'Saída — baixa o estoque; conclui sem identificação.', view:()=>viewMovimento('morte') },
    { id:'gestao2',   title:'Gestão de Lotes', icon:'gestaoLotes',layer:'estoque', desc:'Lote como identidade + 3 controles (composição, local, regime).', view:viewGestaoLotes2 },
    { id:'pesagens',  title:'Pesagens',        icon:'pesagens',  layer:'individual', desc:'Evento individual; alimenta GMD e curva de peso.', view:viewPesagens },
    { id:'reproducao',title:'Reprodução',      icon:'reproducao',layer:'individual', desc:'Cobertura/IATF, diagnóstico e parto.', view:viewReproducao },
    { id:'mesa',      title:'Mesa de Conciliação',icon:'mesa',   layer:'mesa',       desc:'Cartões de divergência da camada individual.', view:viewMesa, badge:()=>pendenciasMesa().length },
  ]},
  { group:'RELATÓRIOS', label:'RELATÓRIOS', items:[
    { id:'rel-mov',   title:'Relatório por movimento',icon:'relMov',layer:'mesa',    desc:'Um por tipo, com status de conciliação.', view:viewRelMov },
    { id:'rel-peso',  title:'Ganho de peso',   icon:'relPeso',   layer:'individual', desc:'GMD, ranking e desvio da média do grupo.', view:viewRelPeso },
    { id:'rel-rep',   title:'Reprodutivo',     icon:'relReprod', layer:'individual', desc:'Taxa de prenhez, coberturas e partos por matriz.', view:viewRelReprod },
  ]},
];
function findItem(id){ for(const g of NAV) for(const it of (g.items||[])) if(it.id===id) return it; return null; }

let CURRENT = 'home';
function go(id){ if(typeof NASC_PANEL!=='undefined'){ NASC_PANEL='recent'; NASC_CATS=[]; if(typeof NASC_DETALHE!=='undefined'){ NASC_DETALHE=[]; NASC_FROMID=false; } if(typeof SAN_ITEMS!=='undefined'){ SAN_ITEMS=[]; SAN_APLIC='unica'; } } CURRENT = id; localStorage.setItem('inttegra-view', id); render(); document.querySelector('.content').scrollTop=0; }

/* ===== Sidebar ===== */
function renderSidebar(){
  const groups = NAV.map(g=>`
    <div class="sb-group-label">${g.label}</div>
    ${g.items.map(it=>{
      const badge = it.badge ? it.badge() : 0;
      return `<button class="sb-item ${CURRENT===it.id?'active':''}" onclick="go('${it.id}')">
        ${icon(it.icon)}<span class="label">${it.title}</span>
        ${badge?`<span class="badge-count">${badge}</span>`:''}
      </button>`;
    }).join('')}
  `).join('');
  return `
    <div class="sb-brand">
      <span class="sb-logo">${icon('cow')}</span>
      <span class="name" onclick="go('home')" style="cursor:pointer">Gesttor</span>
      <button class="sb-collapse" onclick="document.querySelector('.app').classList.toggle('collapsed')" title="Recolher">${icon('collapse')}</button>
    </div>
    <nav class="sb-nav">${groups}</nav>
    <div class="sb-user">
      <span class="sb-avatar">A</span>
      <div class="u-meta">
        <div class="u-name">Antonio C Admin</div>
        <div class="u-role">Administrador</div>
        <div class="u-ver">V1.5.89 SAAS</div>
      </div>
    </div>`;
}

/* ===== Topbar ===== */
function renderTopbar(){
  return `
    <div class="tb-context">
      <button class="tb-drop"><span class="sub">Analista</span> Antonio Chaker ${icon('chevDown')}</button>
      <span class="tb-sep">/</span>
      <button class="tb-drop"><span class="sub">Cliente</span> Reunidas Floresta ${icon('chevDown')}</button>
      <span class="tb-sep">/</span>
      <button class="tb-drop"><span class="sub">Fazenda</span> Natura 1 ${icon('chevDown')}</button>
    </div>
    <div class="tb-right">
      <button class="tb-support">${icon('help')} Suporte<span class="dot"></span></button>
    </div>`;
}

/* ===== Router ===== */
function render(){
  document.querySelector('.sidebar').innerHTML = renderSidebar();
  document.querySelector('.topbar').innerHTML = renderTopbar();
  const content = document.querySelector('.content');
  if(CURRENT==='home'){ content.innerHTML = viewHome(); return; }
  const it = findItem(CURRENT);
  content.innerHTML = it ? it.view() : viewHome();
  if(CURRENT==='compra'||CURRENT==='venda'||CURRENT==='morte'){ updMovPreview(CURRENT); }
  if(CURRENT==='nascimento'){ updSalvarState(); }
}

/* ===== Init ===== */
function init(){
  CURRENT = localStorage.getItem('inttegra-view') || 'home';
  if(CURRENT!=='home' && !findItem(CURRENT)) CURRENT='home';
  render();
}
document.addEventListener('DOMContentLoaded', init);

  </script>
